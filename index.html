      const secundariasComPendente = secundarias.filter(o=>pendentesParaEntrada(postoAtivo,o).length>0);
      principais.forEach(o=> origWrap.appendChild(criarBotaoOrigem(o)));
      secundariasComPendente.forEach(o=> origWrap.appendChild(criarBotaoOrigem(o)));
      const restantes = secundarias.filter(o=>!secundariasComPendente.includes(o));
      if(restantes.length){
        if(formState.mostrarOutrasOrigens){ restantes.forEach(o=> origWrap.appendChild(criarBotaoOrigem(o))); }
        else {
          const mais = document.createElement('button');
          mais.className = 'btn ghost small';
          mais.textContent = `+ outras origens (${restantes.length})`;
          mais.onclick = ()=>{ formState.mostrarOutrasOrigens = true; renderForm(); };
          origWrap.appendChild(mais);
        }
      }
      const vWrap = area.querySelector('#viagens-lista');
      const viagens = viagensParaEntrada(postoAtivo, formState.origem);
      if(!formState.origem){ vWrap.innerHTML = '<p style="font-size:12.5px;color:var(--ink-mute);margin:0;">Escolhe primeiro a proveniência.</p>'; }
      else if(viagens.length===0){ vWrap.innerHTML = '<p style="font-size:12.5px;color:var(--ink-mute);margin:0;">Nada a chegar de '+formState.origem+'.</p>'; }
      else if(viagem){
        const ic = viagem.modal==='comboio' ? '🚂' : '🚛';
        const pesoViagem = viagem.blocos.reduce((s,b)=> s + (b.pesoKg||0), 0);
        vWrap.innerHTML = `
          <div style="border:2px solid var(--moss);background:var(--moss-bg);border-radius:10px;padding:10px;">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
              <div>
                <p style="font-size:13.5px;font-weight:600;margin:0 0 2px;">${viagem.guia ? ('Guia '+viagem.guia) : 'Produção — Mingue'}</p>
                <p style="font-size:11.5px;color:var(--ink-soft);margin:0;">${ic} ${viagem.blocos.length} bloco(s) · ${formatarTonTotal(pesoViagem)}${viagem.hora?(' · saiu '+viagem.hora):''}</p>
                ${viagem.desviada ? `<p style="font-size:11.5px;color:var(--amber);margin:4px 0 0;">⚠ Declarada para ${viagem.destinoDeclarado}</p>` : ''}
              </div>
              <button id="btn-trocar-guia" class="btn ghost small">Trocar</button>
            </div>
          </div>`;
        vWrap.querySelector('#btn-trocar-guia').onclick = ()=>{ formState.guiaSel = null; formState.selecionados = []; formState.trocaPessoa = false; renderForm(); };
      } else {
        const montarLinhaViagem = (v)=>{
          const ic = v.modal==='comboio' ? '🚂' : '🚛';
          const row = document.createElement('div');
          row.className = 'row expandivel';
          if(v.desviada){ row.style.borderColor = 'var(--amber)'; }
          const pesoV = v.blocos.reduce((s,b)=> s + (b.pesoKg||0), 0);
          const titulo = v.guia ? `Guia ${v.guia}` : 'Produção — Mingue';
          const sub = v.guia
            ? `${ic} ${v.blocos.length} bloco(s) · ${formatarTonTotal(pesoV)} · ${v.motorista || '—'}${v.hora?(' · '+v.hora):''}${v.desviada?(' · ia para '+v.destinoDeclarado):''}`
            : `${v.blocos.length} bloco(s) · ${formatarTonTotal(pesoV)} parados — sem guia registada`;
          row.innerHTML = `<span class="num" style="font-family:var(--sans);font-weight:600;">${v.desviada?'⚠ ':''}${titulo}</span><span class="meta">${sub}</span>`;
          row.onclick = ()=>{ adoptarViagem(v); renderForm(); };
          return row;
        };
        const esperadas = viagens.filter(v=>!v.desviada);
        const desviadas = viagens.filter(v=>v.desviada);
        esperadas.forEach(v=> vWrap.appendChild(montarLinhaViagem(v)));
        if(desviadas.length){
          const t = document.createElement('p');
          t.style.cssText = 'font-size:11px;color:var(--amber);margin:10px 0 4px;';
          t.textContent = `A circular com outro destino (${desviadas.length})`;
          vWrap.appendChild(t);
          desviadas.forEach(v=> vWrap.appendChild(montarLinhaViagem(v)));
        }
      }
    }
    if(entrada && !formState.guiaSel) return;
    if(comboioPossivel && !pessoaDaGuia){
      const modWrap = area.querySelector('#modais');
      [['🚛 Camião','camiao'],['🚂 Comboio','comboio']].forEach(([label,val])=>{
        const b = document.createElement('button');
        b.className = 'btn small ' + (formState.modal===val ? 'primary' : 'ghost');
        b.textContent = label;
        b.onclick = ()=>{ aplicarModal(val); renderForm(); };
        modWrap.appendChild(b);
      });
    }
    const btnTroca = area.querySelector('#btn-troca-pessoa');
    if(btnTroca){ btnTroca.onclick = ()=>{ formState.trocaPessoa = true; formState.nome = null; formState.matricula = null; formState.externo = false; formState.empresaExterna = ''; renderForm(); }; }
    if(escolherPessoa){
      const inputPessoa = area.querySelector('#input-busca-pessoa');
      const sugPessoa = area.querySelector('#sugestoes-pessoa');
      const fontePessoa = ehComboio ? STATE.maquinistas.filter(m=>m.activo!==false).map(m=>({ nome:m.maquinista, ref:m.locomotiva })) : STATE.motoristas.filter(m=>m.activo!==false).map(m=>({ nome:m.nome, ref:m.matricula }));
      const ultimoObj = ehComboio ? { nome: STATE.ultimoComboio.maquinista, ref: STATE.ultimoComboio.locomotiva } : { nome: STATE.ultimo.nome, ref: STATE.ultimo.matricula };
      const montarLinhaPessoa = (m, destaque)=>{
        const row = document.createElement('div');
        row.className = 'row'; row.style.cursor = 'pointer';
        if(destaque){ row.style.border = '2px solid var(--moss)'; row.style.background = 'var(--moss-bg)'; }
        row.innerHTML = `<span class="num" style="font-family:var(--sans);font-weight:600;">${destaque?'★ ':''}${escH(m.nome)}</span><span class="meta">${escH(m.ref)}${destaque?' · último usado':''}</span>`;
        row.onclick = ()=>{ if(destaque){ preencherUltimo(formState.modal); } else { formState.nome=m.nome; formState.matricula=m.ref; formState.usandoUltimo=false; } formState.externo=false; formState.empresaExterna=''; renderForm(); };
        return row;
      };
      const mostrarSugestoesPessoa = (q)=>{
        sugPessoa.innerHTML = '';
        const termo = (q||'').trim().toLowerCase();
        if(!termo){ if(ultimoObj.nome) sugPessoa.appendChild(montarLinhaPessoa(ultimoObj, true)); else if(!fontePessoa.length){ sugPessoa.innerHTML = '<p style="font-size:12px;color:var(--ink-mute);margin:0;">Lista da empresa ainda não carregada. Toca em Atualizar ou usa «Motorista externo».</p>'; } return; }
        const encontrados = fontePessoa.filter(m=> m.nome.toLowerCase().includes(termo) || m.ref.toLowerCase().includes(termo.replace(/\s/g,''))).slice(0,4);
        if(encontrados.length===0){ sugPessoa.innerHTML = '<p style="font-size:12px;color:var(--ink-mute);margin:0;">Nenhum resultado. Se não é da empresa, usa «Motorista externo / viatura alugada».</p>'; return; }
        encontrados.forEach(m=> sugPessoa.appendChild(montarLinhaPessoa(m, false)));
        const dica = document.createElement('p'); dica.style.cssText = 'font-size:12px;color:var(--amber);margin:6px 0 0;'; dica.textContent = 'Toca num nome da lista para o escolher.'; sugPessoa.appendChild(dica);
      };
      inputPessoa.addEventListener('input', ()=> mostrarSugestoesPessoa(inputPessoa.value));
      mostrarSugestoesPessoa('');
      const btnExt = area.querySelector('#btn-externo');
      if(btnExt) btnExt.onclick = ()=>{ formState.externo = true; formState.usandoUltimo = false; formState.nome = ''; formState.matricula = ''; formState.empresaExterna = ''; renderForm(); setTimeout(()=>{ const i = document.getElementById('ext-nome'); if(i) i.focus(); }, 80); };
      if(formState.externo){
        if(inputPessoa.parentElement) inputPessoa.parentElement.style.display = 'none';
        sugPessoa.style.display = 'none';
        const eN = area.querySelector('#ext-nome'), eM = area.querySelector('#ext-matricula'), eE = area.querySelector('#ext-empresa');
        if(eN) eN.addEventListener('input', ()=>{ formState.nome = eN.value.trim(); });
        if(eM) eM.addEventListener('input', ()=>{ eM.value = eM.value.toUpperCase(); formState.matricula = eM.value.trim(); });
        if(eE) eE.addEventListener('input', ()=>{ formState.empresaExterna = eE.value.trim(); });
        const bV = area.querySelector('#btn-ext-voltar');
        if(bV) bV.onclick = ()=>{ formState.externo = false; formState.empresaExterna = ''; formState.nome = null; formState.matricula = null; renderForm(); };
      }
    }
    if(!entrada && (!noPorto || (tipoCargaAtual && tipoCargaAtual!=='misto'))){
      const destWrap = area.querySelector('#destinos');
      let opcoes;
      if(noPorto && tipoCargaAtual==='contentor'){ opcoes = [['Entregue ao terminal (Sogester)','entregue_sogester'],['Aguarda embarque','aguarda_embarque_contentor'],['Regressa ao Saco-Mar','Saco-Mar']]; }
      else if(noPorto){ opcoes = [['Embarcou no navio','embarcado'],['Aguarda próximo navio','aguarda_navio'],['Regressa ao Saco-Mar','Saco-Mar']]; }
      else { opcoes = destinos.map(d=>[d,d]); }
      if(opcoes.length===0) destWrap.innerHTML = '<p style="font-size:12.5px;color:var(--ink-mute);margin:0;">Este posto não tem saídas autorizadas.</p>';
      if(formState.destino && !opcoes.some(([,val])=>val===formState.destino)) formState.destino = null;
      opcoes.forEach(([label,val])=>{
        const b = document.createElement('button');
        b.className = 'btn small ' + (formState.destino===val ? 'primary' : 'ghost');
        b.textContent = label;
        b.onclick = ()=>{ formState.destino = val; if(val!=='embarcado') formState.missaoId = null; renderForm(); };
        destWrap.appendChild(b);
      });
    }
    const inputMatConfirm = area.querySelector('#input-matricula-confirm');
    if(inputMatConfirm) inputMatConfirm.addEventListener('input', ()=>{ formState.matricula = inputMatConfirm.value.trim(); });
    const inputCarr = area.querySelector('#input-carruagem');
    if(inputCarr) inputCarr.addEventListener('input', ()=>{ formState.carruagem = inputCarr.value.trim(); });
    const missoesWrap = area.querySelector('#missoes-lista');
    if(missoesWrap){
      missoesWrap.innerHTML = '';
      const activas = STATE.missoes.filter(m=>m.estado==='activa');
      if(activas.length===0) missoesWrap.innerHTML = '<p style="font-size:12.5px;color:var(--ink-mute);margin:0;">Sem missões activas.</p>';
      activas.forEach(m=>{
        const row = document.createElement('div');
        row.className = 'row'; row.style.cursor = 'pointer';
        if(formState.missaoId===m.id){ row.style.border = '2px solid var(--moss)'; row.style.background = 'var(--moss-bg)'; }
        row.innerHTML = `<span class="num" style="font-family:var(--sans);font-weight:600;">${m.navio}</span><span class="meta">${m.id} · ${m.tipo} · ${m.local}${m.metaTon?' · '+formatarTonTotal(m.metaTon*1000):''}</span>`;
        row.onclick = ()=>{ formState.missaoId = m.id; renderForm(); };
        missoesWrap.appendChild(row);
      });
    }
    const tipoSaidaWrap = area.querySelector('#tipo-saida-chibia');
    if(tipoSaidaWrap){
      [['A granel','granel'],['Contentor','contentor']].forEach(([label,val])=>{
        const b = document.createElement('button');
        b.className = 'btn small ' + (formState.tipoSaidaChibia===val ? 'primary' : 'ghost');
        b.textContent = label;
        b.onclick = ()=>{
          formState.tipoSaidaChibia = val;
          if(val==='contentor' && !formState.processoContentor){
            const nums = formState.blocos.map(x=>x.trim()).filter(Boolean);
            const procs = [...new Set(nums.map(n=>{ const bb = STATE.blocos.find(x=>x.numero===n); return bb ? bb.processo : null; }).filter(Boolean))];
            if(procs.length===1) formState.processoContentor = procs[0];
          }
          renderForm();
        };
        tipoSaidaWrap.appendChild(b);
      });
    }
    const inputProcessoChibia = area.querySelector('#input-processo-chibia');
    if(inputProcessoChibia) inputProcessoChibia.addEventListener('input', ()=>{ formState.processoContentor = inputProcessoChibia.value.trim(); });
    const inputContentorChibia = area.querySelector('#input-contentor-chibia');
    if(inputContentorChibia) inputContentorChibia.addEventListener('input', ()=>{ formState.numContentor = inputContentorChibia.value.trim(); });
    if(!embarque && guiaEditavel){
      const inputGuia = area.querySelector('#input-guia');
      inputGuia.addEventListener('input', (e)=>{
        formState.guia = e.target.value.replace(/\D/g,'');
        const gNum = parseInt(formState.guia, 10);
        const dup = STATE.guiasUsadas.has(gNum);
        const esperada = nextGuia();
        const foraSeq = !dup && gNum && gNum !== esperada;
        const warn = area.querySelector('#guia-warn');
        inputGuia.style.borderColor = dup ? 'var(--rust)' : (foraSeq ? 'var(--amber)' : 'var(--border-strong)');
        if(dup){ warn.style.display='block'; warn.style.color='var(--rust)'; warn.textContent='⚠ Esta guia já foi registada.'; }
        else if(foraSeq){ warn.style.display='block'; warn.style.color='var(--amber)'; warn.textContent=`⚠ Fora da sequência esperada (${esperada}).`; }
        else { warn.style.display='none'; }
      });
    }
    if(entrada){
      const listWrap = area.querySelector('#pendentes-lista');
      const pendentes = viagem ? viagem.blocos : [];
      formState.selecionados = formState.selecionados.filter(n=> pendentes.some(p=>p.numero===n));
      if(pendentes.length===0){ listWrap.innerHTML = '<p style="font-size:12.5px;color:var(--ink-mute);margin:0 0 14px;">Esta guia já não tem blocos por confirmar.</p>'; }
      else {
        const precisaFiltro = pendentes.length > 8;
        const buscaTxt = (formState.filtroPendente||'').trim().toLowerCase();
        const filtrados = buscaTxt ? pendentes.filter(b=> b.numero.toLowerCase().includes(buscaTxt)) : pendentes;
        const LIMITE = 8;
        const mostrar = (buscaTxt || formState.mostrarTodosPendentes) ? filtrados : filtrados.slice(0, LIMITE);
        listWrap.innerHTML = precisaFiltro ? `<input id="filtro-pendente" placeholder="Procurar nº de bloco..." value="${formState.filtroPendente||''}" style="width:100%;height:36px;border-radius:8px;border:1px solid var(--border-strong);padding:0 10px;font-size:12.5px;margin-bottom:8px;background:var(--surface);color:var(--ink);" />` : '';
        if(guiaProducao){
          const nota = document.createElement('p');
          nota.style.cssText = 'font-size:11px;color:var(--ink-mute);margin:0 0 6px;';
          nota.textContent = `Marca os blocos que vieram nesta viatura (até ${cap}).`;
          listWrap.appendChild(nota);
        }
        mostrar.forEach(b=>{
          const marcado = formState.selecionados.includes(b.numero);
          const cheio = formState.selecionados.length>=cap && !marcado;
          const row = document.createElement('label');
          row.className = 'row';
          row.style.cssText = 'cursor:pointer;opacity:'+(cheio?'0.4':'1')+';';
          const notaProc = b.processo ? '' : ' · sem processo';
          row.innerHTML = `<span class="num">${marcado?'☑':'☐'} Bloco ${b.numero}${notaProc}</span><span class="meta">${b.pesoKg?formatarTon(b.pesoKg)+' · ':''}${b.processo?b.processo:'sem processo'}</span>`;
          row.onclick = ()=>{
            if(marcado){ formState.selecionados = formState.selecionados.filter(n=>n!==b.numero); }
            else if(formState.selecionados.length<cap){ formState.selecionados.push(b.numero); }
            else { showToast(`Máximo de ${cap} blocos`, 'err'); return; }
            formState.focoFiltro = false; renderForm();
          };
          listWrap.appendChild(row);
        });
        if(!buscaTxt && !formState.mostrarTodosPendentes && filtrados.length > LIMITE){
          const more = document.createElement('button');
          more.className = 'btn ghost small';

    const idTxt = g.modal==='embarque' ? (g.missaoId ? `missão ${g.missaoId}` : 'sem missão') : `guia ${g.numero||'—'} · ${g.motorista||'—'}${g.divergente?' (trocou)':''} · ${g.viatura||'—'}`;
    row.innerHTML = `<span class="num"><span class="seta-exp" style="display:inline-block;width:12px;color:var(--slate);">▸</span> ${marca}${blocosTxt}${peso?(' · '+peso):''} · ${idTxt}</span><span class="meta">${ic}${carr} ${g.de} → ${g.para} · ${g.data} ${g.hora}</span>`;
    return tornarExpansivel(row, g);
  }
  function renderRecent(){

    if(STATE.guias.length===0) rec.innerHTML = '<p style="font-size:12.5px;color:var(--ink-mute);">Sem confirmações ainda.</p>';
    phone.querySelector('#btn-ver-todas').onclick = ()=>{ verTudo = true; renderRecent(); };
  }
  function showToast(msg, kind){
    const t = phone.querySelector('#toast');
    t.style.display='block'; t.className='toast '+kind; t.textContent=msg;
    if(navigator.vibrate){ navigator.vibrate(kind==='ok' ? 40 : [45,70,45]); }
    const flash = phone.querySelector('#flash-conferente');
    if(flash){
      flash.className = 'flash-overlay on' + (kind==='err' ? ' err' : '');
      setTimeout(()=>{ flash.className = 'flash-overlay'; }, kind==='err' ? 160 : 220);
    }
    clearTimeout(t._hideTimer);
    t.onclick = ()=>{ t.style.display='none'; clearTimeout(t._hideTimer); };
    t._hideTimer = setTimeout(()=>{ t.style.display='none'; }, kind==='ok' ? 2600 : 7000);
  }
  renderAll();
  return wrap;
}

const PARQUES = ['Mingue','Chibia','Arimba','Caraculo','Saco-Mar','Sogester'];
function parqueDe(b){
  const l = b.local;
  if(!l) return null;
  if(b.estado==='anulado') return null;
  if(l.startsWith('A caminho de')) return null;
  if(l.startsWith('Embarcado')) return null;
  return PARQUES.find(p=> l.startsWith(p)) || null;
}
function pertenceAoParque(str, parque){ return !!str && str.startsWith(parque); }
function contagemPorOrigem(){
  const map = {}; PARQUES.forEach(p=>{ map[p] = 0; });
  STATE.blocos.forEach(b=>{ const p = parqueDe(b); if(p) map[p] = (map[p]||0) + 1; });
  return map;
}
function pesoPorParque(){
  const map = {}; PARQUES.forEach(p=>{ map[p] = 0; });
  STATE.blocos.forEach(b=>{ const p = parqueDe(b); if(p) map[p] = (map[p]||0) + pesoDeBloco(b); });
  return map;
}

let dgDetail = false;
let dirVista = 'kpis';
let dirSeccao = 'missoes';
const DIR_SECCOES = [
  { id:'missoes',    label:'Missões' },
  { id:'transporte', label:'Transporte diário' },
  { id:'processos',  label:'Processos' },
];
/* ---------------- DIREÇÃO: resumo diário por elo (rascunho) ---------------- */
function resumoTransporteDiario(){
  const hoje = agoraISO();
  const porElo = new Map();
  STATE.guias.forEach(g=>{
    if(g.tipo !== 'saida' || !g.de || !g.para) return;
    const key = g.de+'→'+g.para;
    if(!porElo.has(key)) porElo.set(key, { de:g.de, para:g.para, porDia:new Map() });
    const elo = porElo.get(key);
    if(!elo.porDia.has(g.data)) elo.porDia.set(g.data, { blocos:0, viagens:0 });
    const dia = elo.porDia.get(g.data);
    dia.blocos += (g.blocos?g.blocos.length:0);
    dia.viagens += 1;
  });
  const linhas = [];
  porElo.forEach(elo=>{
    const diasAnteriores = Array.from(elo.porDia.entries()).filter(([d])=> d!==hoje);
    const n = diasAnteriores.length;
    const mediaBlocos = n ? diasAnteriores.reduce((s,[,v])=>s+v.blocos,0)/n : null;
    const mediaViagens = n ? diasAnteriores.reduce((s,[,v])=>s+v.viagens,0)/n : null;
    const hojeDados = elo.porDia.get(hoje) || { blocos:0, viagens:0 };
    let tendencia = null;
    if(mediaBlocos!==null && mediaBlocos>0){
      const delta = (hojeDados.blocos - mediaBlocos) / mediaBlocos;
      tendencia = delta > 0.1 ? 'up' : (delta < -0.1 ? 'down' : 'igual');
    }
    linhas.push({ de:elo.de, para:elo.para, blocosHoje:hojeDados.blocos, viagensHoje:hojeDados.viagens, mediaBlocos, mediaViagens, tendencia, amostraDias:n });
  });
  linhas.sort((a,b)=>{
    if(a.para==='Caraculo' && b.para!=='Caraculo') return -1;
    if(b.para==='Caraculo' && a.para!=='Caraculo') return 1;
    return b.blocosHoje - a.blocosHoje;
  });
  return linhas;
}
function excecoesDoDia(){
  const linhas = [];
  const problemBlocos = STATE.blocos.filter(b=>b.estado==='falta' || b.estado==='sem_producao' || b.semRegistoOrigem || b.divergencia);
  problemBlocos.slice(0,2).forEach(b=>{
    const motivo = !b.processo ? 'sem processo atribuído'
      : b.estado==='sem_producao' ? 'sem registo de produção'
      : b.estado==='falta' ? 'vendido sem localização confirmada'
      : b.semRegistoOrigem ? 'digitado sem registo anterior'
      : 'divergência por resolver';
    linhas.push(`Bloco ${b.numero}${b.processo?(' · '+b.processo):''} — ${motivo}`);
  });
  STATE.guias.filter(g=>g.divergente).slice(0,2).forEach(g=>{
    linhas.push(`Guia ${g.numero} — motorista trocou sem confirmação (${g.motorista||'—'})`);
  });
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const paradas = [];
  processoDe().forEach((blocos, codigo)=>{
    if(blocos.every(b=>ESTADOS_FINAIS_PORTO.includes(b.estado))) return;
    const nums = new Set(blocos.map(b=>b.numero));
    let ultimaData = null;
    STATE.guias.forEach(g=>{
      if(g.blocos && g.blocos.some(n=>nums.has(n))){
        if(!ultimaData || g.data > ultimaData) ultimaData = g.data;
      }
    });
    if(!ultimaData) return;
    const d = new Date(ultimaData+'T00:00:00');
    const dias = Math.round((hoje.getTime() - d.getTime()) / 86400000);
    if(dias >= 3) paradas.push({ codigo, dias });
  });
  paradas.sort((a,b)=>b.dias-a.dias).slice(0,2).forEach(p=>{
    linhas.push(`Processo ${p.codigo} sem movimento há ${p.dias} dias`);
  });
  return linhas.slice(0,4);
}
function resumoProcessosDiretor(){
  const porProc = processoDe();
  const linhas = [];
  porProc.forEach((blocos, codigo)=>{
    const total = blocos.length;
    const concluidos = blocos.filter(b=> ESTADOS_FINAIS_PORTO.includes(b.estado)).length;
    linhas.push({ codigo, total, concluidos, pct: total ? Math.round(concluidos/total*100) : 0 });
  });
  linhas.sort((a,b)=> b.total - a.total);
  return linhas.slice(0,5);
}

/* ---------------- DIREÇÃO: risco de prazo = o que é humanamente factível ---------------- */
const ETAPAS_REDE = ['Chibia','Arimba','Caraculo','Saco-Mar','Sogester'];
const FRONTEIRAS = ['Pedreira → Chibia','Chibia → Arimba','Arimba → Caraculo','Caraculo → Saco-Mar','Saco-Mar → Sogester'];
function idxEtapa(nome){ if(!nome) return 0; const t = String(nome); return ETAPAS_REDE.findIndex(e=>t.startsWith(e)) + 1; }   // 0 = pedreira
function etapaDoBloco(b){
  if(!b || b.estado==='anulado') return null;
  if(b.estado==='embarcado' || b.estado==='entregue_sogester') return 6;
  if(b.estado==='a_caminho') return idxEtapa(b.destinoMovimento || String(b.local||'').replace(/^A caminho de\s+/,''));
  return idxEtapa(b.local);
}
/* blocos por dia que atravessam cada fronteira: média dos últimos 3 dias (antes de hoje) com movimento; precisa de 2 dias */
function ritmoPorFronteira(){
  const hoje = agoraISO(); const porDia = FRONTEIRAS.map(()=>new Map());
  STATE.guias.forEach(g=>{
    if(!ehViagem(g) || !g.data) return;
    const a = idxEtapa(g.de), b = idxEtapa(g.para), n = (g.blocos||[]).length;
    for(let f=0; f<FRONTEIRAS.length; f++){ if(a<=f && f<b) porDia[f].set(g.data, (porDia[f].get(g.data)||0)+n); }
  });
  return porDia.map(m=>{
    const dias = [...m.entries()].filter(([d])=>d!==hoje).sort((x,y)=>y[0].localeCompare(x[0])).slice(0,3);
    return dias.length>=2 ? dias.reduce((s,[,v])=>s+v,0)/dias.length : null;
  });
}
const fmt1 = n=> (n===null||n===undefined||isNaN(n)) ? '—' : Number(n).toLocaleString('pt-PT',{maximumFractionDigits:1});
/* Avalia cada missão (processo com navio e embarque). O ritmo é dado primeiro ao embarque mais próximo, e o resto aos seguintes. */
function avaliarMissoes(){
  const ritmo = ritmoPorFronteira(); const porProc = processoDe();
  const info = (STATE.missoes||[]).filter(m=>m.estado==='activa'||!m.estado).map(m=>{
    const blocos = (porProc.get(m.id)||[]).filter(b=>b.estado!=='anulado');
    const dem = FRONTEIRAS.map(()=>0); const posic = [];
    blocos.forEach(b=>{ const e = etapaDoBloco(b); if(e===null) return; if(e>=5) posic.push(b); for(let f=0; f<FRONTEIRAS.length; f++){ if(e<=f) dem[f]++; } });
    const prazo = m.dataCarregamento || m.dataPosicionamento || null;
    const alvo = parseDataPT(prazo);
    return { m, blocos, dem, posic, ton: somaPeso(posic), prazo, dias: prazo ? diasAteData(prazo) : null, alvo, semLista: Math.max(0,(m.meta||0)-blocos.length) };
  }).sort((a,b)=>(a.alvo?a.alvo.getTime():9e15)-(b.alvo?b.alvo.getTime():9e15));
  const cum = FRONTEIRAS.map(()=>0);
  return info.map(x=>{
    x.dem.forEach((d,f)=>{ cum[f]+=d; });
    x.linhas = FRONTEIRAS.map((nome,f)=>({ nome, demanda:x.dem[f], fila:cum[f]-x.dem[f], acumulada:cum[f], ritmo:ritmo[f], dias:(x.dem[f]>0 && ritmo[f]) ? cum[f]/ritmo[f] : null })).filter(l=>l.demanda>0);
    const medidas = x.linhas.filter(l=>l.dias!==null);
    x.semRitmo = x.linhas.filter(l=>l.dias===null).map(l=>l.nome);
    x.gargalo = medidas.length ? medidas.reduce((a,b)=>b.dias>=a.dias?b:a) : null;   // em empate, a fronteira mais perto do destino
    x.precisa = x.gargalo ? x.gargalo.dias : null;
    if(!x.blocos.length) x.status = 'sem_blocos';
    else if(!x.linhas.length) x.status = 'posicionada';
    else if(x.precisa===null) x.status = 'sem_ritmo';
    else if(x.dias===null) x.status = 'sem_prazo';
    else if(x.dias<=0) x.status = 'risco';
    else { const r = x.precisa/x.dias; x.status = r<=0.8 ? 'ok' : (r<=1 ? 'atencao' : 'risco'); }
    return x;
  });
}
function explicaMissao(x){
  if(x.status==='sem_blocos') return 'Ainda não há blocos atribuídos a este processo.';
  if(x.status==='posicionada') return 'Todos os blocos atribuídos já estão posicionados.';
  if(x.status==='sem_ritmo') return 'Ainda sem ritmo medido: precisa de 2 dias de movimentos para estimar o prazo.';
  const g = x.gargalo; const d = x.dias;
  const prazoTxt = d===null ? 'sem data de embarque' : (d<=0 ? 'prazo chegou' : `restam ${d} dia(s)`);
  return `${g.acumulada} por atravessar ${g.nome} · ritmo ${fmt1(g.ritmo)}/dia · precisa de ${fmt1(g.dias)} dias · ${prazoTxt}`;
}
/* camiões a sério: matrículas distintas que aparecem em guias */
function camioesReais(){
  const hoje = agoraISO(); const norm = v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const porElo = new Map(), hojeTodos = new Set(), estradaTodos = new Set();
  const elo = (de,para)=>{ const k=de+' → '+para; if(!porElo.has(k)) porElo.set(k,{ de, para, ativos:new Set(), viagens:0, blocos:0, estrada:new Set() }); return porElo.get(k); };
  const d2 = new Date(); d2.setDate(d2.getDate()-2); const limite = d2.toLocaleDateString('en-CA');
  STATE.guias.forEach(g=>{
    if(!ehViagem(g)) return; const v = norm(g.viatura);
    if(g.data===hoje){ const e = elo(g.de,g.para); e.viagens++; e.blocos += (g.blocos||[]).length; if(v){ e.ativos.add(v); hojeTodos.add(v); } }
    if(g.tipo==='saida' && v && g.data>=limite){
      const conf = new Set(); STATE.guias.forEach(x=>{ if(x.tipo==='entrada' && x.de===g.de && x.numero===g.numero) (x.blocos||[]).forEach(n=>conf.add(n)); });
      if((g.blocos||[]).some(n=>!conf.has(n))){ elo(g.de,g.para).estrada.add(v); estradaTodos.add(v); }
    }
  });
  const linhas = [...porElo.values()].map(e=>({ de:e.de, para:e.para, ativos:e.ativos.size, estrada:e.estrada.size, viagens:e.viagens, blocos:e.blocos }))
    .filter(l=>l.ativos||l.estrada||l.viagens).sort((a,b)=>b.ativos-a.ativos);
  return { linhas, hoje: hojeTodos.size, estrada: estradaTodos.size, cadastradas: (STATE.motoristas||[]).filter(m=>m.activo!==false).length };
}

function clienteDe(){
  const map = new Map();
  STATE.blocos.forEach(b=>{ const c = clienteDeBloco(b); if(!c) return; if(!map.has(c)) map.set(c, []); map.get(c).push(b); });
  return map;
}
function processoDe(){
  const map = new Map();
  STATE.blocos.forEach(b=>{ if(!b.processo) return; if(!map.has(b.processo)) map.set(b.processo, []); map.get(b.processo).push(b); });
  return map;
}

function postSala(processo, texto, autor){
  if(window.BF_USER && !autor) return;   // registos do sistema vêm do servidor
  STATE.sala = STATE.sala || [];
  STATE.sala.push({ processo, autor: autor||'Sistema', texto, quando: agoraISO()+' '+nowStr(), sistema: !autor });
  try{ localStorage.setItem('bf_sala', JSON.stringify(STATE.sala)); }catch(e){}
}

let salaProc = null, salaAutor = 'Logística';

    const tagTxt = document.createElement('span'); tagTxt.textContent = m.sistema ? 'Registo do sistema' : (m.autor + (m.nome ? ' · '+m.nome : '')); tag.appendChild(tagTxt);
    const tx = document.createElement('div'); tx.style.cssText = 'font-size:13px;line-height:1.4;'; tx.textContent = m.texto;
    const hr = document.createElement('div'); hr.style.cssText = 'font-size:10.5px;opacity:.65;text-align:right;font-family:var(--mono);margin-top:2px;'; hr.textContent = h;
    if(meu && !m.sistema){ const tk = document.createElement('span'); tk.style.cssText = 'margin-left:5px;font-weight:700;font-size:12px;'; tk.textContent = m.pendente ? '🕓' : '✓'; tk.title = m.pendente ? 'A aguardar envio' : 'Enviada'; hr.appendChild(tk); }

  mw.scrollTop = mw.scrollHeight;
  if(window.bfSala) window.bfSala.marcarLida(salaProc);
  const salaAberta = ()=> document.getElementById('sala-overlay') && document.getElementById('sala-overlay').style.display==='block';
  const enviar = ()=>{ const inp = el.querySelector('#sala-txt'); const v = inp.value.trim(); if(!v) return; inp.value = ''; if(window.BF_USER && window.bfSala){ window.bfSala.enviar(salaProc, v); } else postSala(salaProc, v, salaAutor); salaFoco = true; if(salaAberta()) renderSalaDrawer(true); else render(); };
  el.querySelector('#sala-env').onclick = enviar;
  el.querySelector('#sala-txt').addEventListener('keydown', e=>{ if(e.key==='Enter') enviar(); });
  if(salaFoco){ salaFoco = false; setTimeout(()=>{ const i = el.querySelector('#sala-txt'); if(i) i.focus(); },0); }
  return el;
}

function servidorLog(){ return !!(window.sb && window.BF_USER && ['admin','logistica','producao'].includes(window.BF_USER.papel)); }
async function corrigirNoServidor(p){
  if(navigator.onLine===false) return { erro:'Sem rede — tenta quando tiveres ligação.' };
  try{ const {data,error} = await window.sb.rpc('corrigir_bloco', { p }); if(error) throw error; return data || {}; }
  catch(e){ return { erro:'Não gravou no servidor: '+(e.message||e) }; }
}
function importarLiberacao(texto, ref, modo){
  STATE.listasExportacao = STATE.listasExportacao || [];
  const nums = [...new Set(String(texto).split(/[\s,;]+/).filter(x=>/^[A-Za-z0-9-]+$/.test(x)))];
  const quando = agoraISO()+' '+nowStr();
  const r = { ref: ref||'Lista sem referência', modo, quando, total: nums.length, aplicados:0, jaEstava:0, naoEncontrados:[] };
  nums.forEach(n=>{
    const b = STATE.blocos.find(x=>x.numero===n);
    if(!b){ r.naoEncontrados.push(n); return; }
    if(modo==='liberar'){ if(b.liberado){ r.jaEstava++; return; } b.liberado = { quando, lista: r.ref }; r.aplicados++; }
    else { if(!b.liberado){ r.jaEstava++; return; } b.liberado = null; r.aplicados++; }
  });
  STATE.listasExportacao.unshift(r);
  const porProc = {};
  nums.forEach(n=>{ const b = STATE.blocos.find(x=>x.numero===n); if(b && b.processo) porProc[b.processo] = (porProc[b.processo]||0)+1; });
  Object.entries(porProc).forEach(([pr,q])=> postSala(pr, `Lista «${r.ref}»: ${q} bloco(s) ${modo==='liberar'?'liberado(s) para embarque':'com liberação retirada'}.`));
  return r;
}

function linhaProblema(b){
  const row = document.createElement('div');
  row.className = 'row';
  const c = clienteDeBloco(b);
  const motivo = !b.processo ? '⚠ sem processo — não pode sair da Chibia'
    : b.estado==='anulado' ? '⊘ anulado'
    : b.estado==='sem_producao' ? 'sem registo de produção'
    : b.estado==='falta' ? 'vendido sem localização confirmada'
    : b.semRegistoOrigem ? 'digitado no Conferente sem registo anterior'
    : 'divergência na última guia';
  row.innerHTML = `<span class="num">Bloco ${b.numero} ${c?('· '+c):''}${b.pesoKg?(' · '+formatarTon(b.pesoKg)):''}</span><span class="meta">${motivo}</span>`;
  return row;
}

function viewLogistica(){
  const el = document.createElement('div');
  el.innerHTML = `
    <div class="panel" style="margin-bottom:14px;">
      <div class="search">
        <span>🔍</span>
        <input id="busca" placeholder="Procurar bloco por Nº, ou guia por Nº..." />
      </div>
      <div id="busca-resultado"></div>
    </div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;">
      <div id="log-nav" style="display:flex;flex-direction:row;flex-wrap:wrap;gap:4px;min-width:150px;max-width:190px;flex:0 0 auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px;position:sticky;top:14px;align-self:flex-start;"></div>
      <div id="log-content" style="flex:1;min-width:260px;"></div>
    </div>
  `;
  el.querySelector('#busca').addEventListener('input', (e)=>{
    const q = e.target.value.trim();
    const res = el.querySelector('#busca-resultado');
    res.innerHTML = '';
    if(!q) return;
    const guiaEncontrada = /^\d+$/.test(q) ? STATE.guias.find(g=>String(g.numero)===q) : null;
    if(guiaEncontrada){
      const head = document.createElement('div');
      head.className = 'row';
      const ic = guiaEncontrada.tipo==='embarque' ? '🚢' : (guiaEncontrada.modal==='comboio' ? '🚂' : '🚛');
      const quem = guiaEncontrada.motorista ? (' · '+escH(guiaEncontrada.motorista)) : '';
      const viatura = guiaEncontrada.viatura ? (' · '+escH(guiaEncontrada.viatura)) : '';
      const peso = guiaEncontrada.pesoKg ? (' · '+formatarTonTotal(guiaEncontrada.pesoKg)) : '';
      head.innerHTML = `<span class="num">${ic} Guia ${q}${quem}${viatura}</span><span class="meta">${guiaEncontrada.de} → ${guiaEncontrada.para} · ${guiaEncontrada.data} ${guiaEncontrada.hora} · ${guiaEncontrada.blocos.length} bloco(s)${peso}</span>`;
      res.appendChild(head);
    }
    const numerosDaGuia = guiaEncontrada ? new Set(guiaEncontrada.blocos) : new Set();
    const found = STATE.blocos.filter(b=> b.numero.includes(q) || numerosDaGuia.has(b.numero));
    if(found.length===0){ res.innerHTML = '<p style="font-size:12.5px;color:var(--ink-mute);margin:0;">Nenhum bloco ou guia encontrado.</p>'; return; }
    found.forEach(b=>{
      const c = clienteDeBloco(b);
      const row = document.createElement('div');
      row.className = 'row';
      const proc = b.processo ? (' · '+b.processo) : ' · ⚠ sem processo';
      const poraoTxt = (b.estado==='embarcado' && b.porao) ? ` · porão ${b.porao}` : '';
      const pesoTxt = b.pesoKg ? ` · ${formatarTon(b.pesoKg)}` : '';
      row.innerHTML = `<span class="num">Bloco ${b.numero} ${c?('· '+c):''}${proc}${pesoTxt}</span><span class="meta">${b.local || 'sem localização'}${poraoTxt}</span>`;
      res.appendChild(row);
      const historico = STATE.guias.filter(g=>g.blocos.includes(b.numero));
      const histWrap = document.createElement('div');
      histWrap.style.cssText = 'margin:0 0 10px 8px;padding-left:8px;border-left:2px solid var(--border);';
      if(historico.length===0) histWrap.innerHTML = '<p style="font-size:11px;color:var(--ink-mute);margin:2px 0;">Sem movimentações registadas.</p>';
      else {
        const LIMITE_HIST = 6;
        historico.slice(0, LIMITE_HIST).forEach(g=>{
          const ic = g.tipo==='embarque' ? '🚢' : (g.modal==='comboio' ? '🚂' : '🚛');
          const poraoTxt = (g.poroes && g.poroes[b.numero]) ? (' · porão '+g.poroes[b.numero]) : '';
          const idTxt = g.tipo==='embarque' ? (g.missaoId?`missão ${g.missaoId}${poraoTxt}`:'sem missão') : `guia ${g.numero||'—'}${g.motorista?(' · '+g.motorista):''}`;
          const p = document.createElement('p');
          p.style.cssText = 'font-size:11px;color:var(--ink-soft);margin:2px 0;';
          p.textContent = `${ic} ${g.de} → ${g.para} · ${idTxt} · ${g.data} ${g.hora}`;
          histWrap.appendChild(p);
        });
        if(historico.length > LIMITE_HIST){
          const p = document.createElement('p');
          p.style.cssText = 'font-size:11px;color:var(--ink-mute);margin:2px 0;';
          p.textContent = `+ ${historico.length - LIMITE_HIST} movimentação(ões) mais antiga(s)`;
          histWrap.appendChild(p);
        }
      }
      res.appendChild(histWrap);
    });
  });
  const nav = el.querySelector('#log-nav');
  LOG_SECCOES.forEach(s=>{
    const b = document.createElement('button');
    b.className = 'btn small ' + (logSeccao===s.id ? 'primary' : 'ghost');
    b.style.cssText += 'text-align:left;width:100%;';
    b.textContent = s.label;
    b.onclick = ()=>{ logSeccao = s.id; render(); };
    nav.appendChild(b);
  });
  const content = el.querySelector('#log-content');
  if(logSeccao==='geral') renderGeral(content);
  else if(logSeccao==='hubs') renderHubs(content);
  else if(logSeccao==='processo') renderProcessoSec(content);
  else if(logSeccao==='cliente') renderClienteSec(content);
  else if(logSeccao==='movimentos') renderMovimentosSec(content);
  else if(logSeccao==='contentores') renderContentoresSec(content);
  else if(logSeccao==='liberacao') renderLiberacaoSec(content);
  else if(logSeccao==='corrigir') renderCorrigirSec(content);
  else if(logSeccao==='equipas') renderEquipasSec(content);
  else if(logSeccao==='relatorios') renderRelatoriosSec(content);

  function renderGeral(content){
    const totalBlocos = STATE.blocos.length;
    const totalPeso = somaPeso(STATE.blocos);
    const comProcesso = STATE.blocos.filter(b=>b.processo).length;
    const semProcessoN = STATE.blocos.filter(b=> !b.processo && b.estado!=='anulado' && b.estado!=='sem_producao' && b.estado!=='falta' && b.estado!=='embarcado' && b.estado!=='entregue_sogester').length;
    const sogesterBlocos = STATE.blocos.filter(b=> parqueDe(b)==='Sogester');
    const sogesterPeso = somaPeso(sogesterBlocos);
    content.innerHTML = `
      <div class="panel" style="margin-bottom:14px;border-color:var(--slate);border-width:1.5px;">
        <p class="section-title" style="color:var(--slate);">Sogester — leitura rápida</p>
        <div class="grid g2">
          <div class="stat" style="background:var(--surface);border-color:var(--slate);"><p class="label">Blocos em parque</p><p class="value">${sogesterBlocos.length}</p></div>
          <div class="stat" style="background:var(--surface);border-color:var(--slate);"><p class="label">Tonelagem em parque</p><p class="value" style="color:var(--slate);">${formatarTonTotal(sogesterPeso)}</p></div>
        </div>
      </div>
      <div class="grid g3" style="margin-bottom:14px;">
        <div class="stat"><p class="label">Total de blocos</p><p class="value">${totalBlocos}</p><p class="sub">${formatarTonTotal(totalPeso)}</p></div>
        <div class="stat"><p class="label">Com processo</p><p class="value">${comProcesso}</p></div>
        <div class="stat ${semProcessoN>0?'warn':''}"><p class="label">Sem processo</p><p class="value">${semProcessoN}</p></div>
      </div>
      <div class="panel" style="margin-bottom:14px;">
        <p class="section-title" style="color:var(--amber);">⚠ Pendências</p>
        <div id="pendentes"></div>
      </div>
      <div class="panel" style="margin-bottom:14px;">
        <p class="section-title">Processos quase completos</p>
        <div id="quase-completos"></div>
      </div>
      <div class="panel">
        <p class="section-title">Actividade recente</p>
        <div id="pulso"></div>
      </div>
    `;
    const pend = content.querySelector('#pendentes');
    const PARQUES_REDE = ['Chibia','Arimba','Caraculo','Saco-Mar','Sogester'];
    const semProcParques = STATE.blocos.filter(b=>!b.processo && b.estado!=='anulado' && PARQUES_REDE.includes(parqueDe(b)));
    const semProcChibia = semProcParques.filter(b=>parqueDe(b)==='Chibia').length;
    if(semProcParques.length>0){
      const aviso = document.createElement('div');
      aviso.className = 'row';
      aviso.style.cssText = 'border-color:var(--amber);cursor:pointer;background:var(--amber-bg);';
      aviso.innerHTML = `<span class="num" style="font-family:var(--sans);font-weight:600;">${semProcParques.length} bloco(s) sem processo nos parques</span><span class="meta" style="color:#8A5E0B;">${semProcChibia ? semProcChibia+' na Chibia não podem sair — ' : ''}toca para resolver</span>`;
      aviso.onclick = ()=>{ logSeccao='processo'; render(); };
      pend.appendChild(aviso);
    }
    const problemBlocos = STATE.blocos.filter(b=>b.estado==='falta' || b.estado==='sem_producao' || b.semRegistoOrigem || b.divergencia);
    if(problemBlocos.length===0 && semProcParques.length===0) pend.innerHTML = '<p style="font-size:12.5px;color:var(--ink-mute);">Sem pendências neste momento.</p>';
    else problemBlocos.forEach(b=> pend.appendChild(linhaProblema(b)));
    const qc = content.querySelector('#quase-completos');
    const grupos = processoDe();
    const comProgresso = [...grupos.entries()].map(([processo, lista])=>{
      const finais = lista.filter(b=>ESTADOS_FINAIS_PORTO.includes(b.estado)).length;
      return { processo, total: lista.length, finais, pct: finais/lista.length, peso: somaPeso(lista) };
    }).filter(p=> p.finais > 0 && p.pct < 1).sort((a,b)=> b.pct - a.pct).slice(0, 4);
    if(comProgresso.length===0) qc.innerHTML = '<p style="font-size:12.5px;color:var(--ink-mute);">Nenhum processo em progresso.</p>';
    else comProgresso.forEach(p=>{

  function renderHubs(content){
    const counts = contagemPorOrigem();
    const pesos = pesoPorParque();
    const emTransito = STATE.blocos.filter(b=> (b.local||'').startsWith('A caminho de')).length;
    const pesoTransito = STATE.blocos.filter(b=> (b.local||'').startsWith('A caminho de')).reduce((s,b)=>s+pesoDeBloco(b),0);
    const embarcados = STATE.blocos.filter(b=> (b.local||'').startsWith('Embarcado')).length;
    const pesoEmbarcado = STATE.blocos.filter(b=> (b.local||'').startsWith('Embarcado')).reduce((s,b)=>s+pesoDeBloco(b),0);
    const anulados = STATE.blocos.filter(b=> b.estado==='anulado').length;
    content.innerHTML = `
      <div class="panel" style="margin-bottom:14px;">
        <p class="section-title">Parques — toca para ver o stock <span style="font-weight:400;color:var(--ink-mute);">(blocos · toneladas)</span></p>
        <div class="grid g3" id="hubs-lista"></div>
        <p style="font-size:11.5px;color:var(--ink-mute);margin:10px 0 0;">Fora dos parques: ${emTransito} em trânsito · ${formatarTonTotal(pesoTransito)} · ${embarcados} já embarcados · ${formatarTonTotal(pesoEmbarcado)}${anulados?` · ${anulados} anulados`:''}</p>
      </div>
      <div id="hub-detalhe"></div>
    `;
    const lista = content.querySelector('#hubs-lista');
    Object.keys(counts).forEach(loc=>{
      const blocosLoc = STATE.blocos.filter(b=> parqueDe(b)===loc);
      const porProc = new Map();
      blocosLoc.forEach(b=>{
        const v = b.processo || 'Sem processo';
        const cur = porProc.get(v) || { n:0, peso:0 };
        cur.n += 1; cur.peso += pesoDeBloco(b);
        porProc.set(v, cur);
      });
      const ordenado = [...porProc.entries()].sort((a,b)=> b[1].n - a[1].n);
      const TOP = 3;
      const linhas = ordenado.slice(0, TOP).map(([nome,v])=> `<span>${nome}<b>${v.n} · ${formatarTon(v.peso)}</b></span>`).join('');
      const resto = ordenado.length > TOP ? `<span style="font-style:italic;">+${ordenado.length-TOP} outro(s) processo(s)</span>` : '';
      const c = document.createElement('div');
      c.className = 'hub-card' + (loc==='Sogester' ? ' destaque' : '');
      c.innerHTML = `
        <p class="hub-label">${loc}${loc==='Sogester'?' · terminal':''}<span class="live-dot"></span></p>
        <p class="hub-total">${counts[loc]}</p>
        <p class="hub-tons">${formatarTonTotal(pesos[loc]||0)}</p>
        <div class="hub-breakdown">${linhas}${resto}</div>
      `;
      c.onclick = ()=>{ logHubDetalhe = loc; logHubFiltroCliente=null; logHubFiltroProcesso=null; render(); };
      lista.appendChild(c);
    });
    if(!logHubDetalhe || counts[logHubDetalhe]===undefined) return;
    const detalhe = content.querySelector('#hub-detalhe');
    let blocosHub = STATE.blocos.filter(b=> parqueDe(b)===logHubDetalhe);
    const SEM_PROCESSO = 'Sem processo (stock livre)';
    const porCliente = contarPorCampo(blocosHub, 'clienteDerivado', 'Sem cliente');
    const porProcesso = contarPorCampo(blocosHub, 'processo', SEM_PROCESSO);
    const pesoHub = somaPeso(blocosHub);
    detalhe.innerHTML = `
      <div class="panel">
        <button class="backbtn" id="back-hub">← voltar aos parques</button>
        <p style="font-size:14px;font-weight:600;margin:0 0 4px;">${logHubDetalhe} · ${blocosHub.length} bloco(s)</p>
        <p style="font-size:13px;color:var(--slate);font-family:var(--mono);font-weight:600;margin:0 0 8px;">${formatarTonTotal(pesoHub)} em parque</p>
        <p class="section-title">Quantidade e tonelagem por processo</p>
        <div style="margin-bottom:12px;" id="hub-f-processo"></div>
        <p class="section-title">Quantidade e tonelagem por cliente</p>
        <div style="margin-bottom:12px;" id="hub-f-cliente"></div>
        <p class="section-title">Blocos${logHubFiltroProcesso||logHubFiltroCliente?' (filtrado)':''}</p>
        <div id="hub-blocos"></div>
      </div>
    `;
    detalhe.querySelector('#back-hub').onclick = ()=>{ logHubDetalhe=null; render(); };
    function contarPorCampo(lista, campo, semLabel){
      const map = new Map();
      lista.forEach(b=>{
        const v = (campo==='clienteDerivado' ? clienteDeBloco(b) : b[campo]) || semLabel;
        const cur = map.get(v) || { n:0, peso:0 };
        cur.n += 1; cur.peso += pesoDeBloco(b);
        map.set(v, cur);
      });
      return [...map.entries()].sort((a,b)=> b[1].n - a[1].n);
    }
    function breakdownList(wrapId, entries, totalCount, totalPeso, actual, onPick){
      const wrap = detalhe.querySelector(wrapId);
      if(!wrap) return;
      const allRow = document.createElement('div');
      allRow.className = 'row'; allRow.style.cursor = 'pointer';
      if(!actual) allRow.style.border = '1.5px solid var(--slate)';
      allRow.innerHTML = `<span class="num" style="font-family:var(--sans);font-weight:600;">Todos</span><span class="meta">${totalCount} bloco(s) · ${formatarTonTotal(totalPeso)}</span>`;
      allRow.onclick = ()=> onPick(null);
      wrap.appendChild(allRow);
      entries.forEach(([label,v])=>{
        const row = document.createElement('div');
        row.className = 'row'; row.style.cursor = 'pointer';
        if(actual===label) row.style.border = '1.5px solid var(--slate)';
        row.innerHTML = `<span class="num" style="font-family:var(--sans);font-weight:600;">${label}</span><span class="meta">${v.n} bloco(s) · ${formatarTonTotal(v.peso)}</span>`;
        row.onclick = ()=> onPick(label);
        wrap.appendChild(row);
      });
    }
    breakdownList('#hub-f-processo', porProcesso, blocosHub.length, pesoHub, logHubFiltroProcesso, (v)=>{ logHubFiltroProcesso=v; render(); });
    breakdownList('#hub-f-cliente', porCliente, blocosHub.length, pesoHub, logHubFiltroCliente, (v)=>{ logHubFiltroCliente=v; render(); });
    if(logHubFiltroProcesso) blocosHub = blocosHub.filter(b=> logHubFiltroProcesso===SEM_PROCESSO ? !b.processo : b.processo===logHubFiltroProcesso);
    if(logHubFiltroCliente) blocosHub = blocosHub.filter(b=>{ const c=clienteDeBloco(b)||'Sem cliente'; return logHubFiltroCliente==='Sem cliente' ? !clienteDeBloco(b) : c===logHubFiltroCliente; });
    const lw = detalhe.querySelector('#hub-blocos');
    if(blocosHub.length===0) lw.innerHTML = '<p style="font-size:12.5px;color:var(--ink-mute);">Sem blocos com este filtro.</p>';
    else blocosHub.forEach(b=>{
      const c = clienteDeBloco(b);
      const row = document.createElement('div');
      row.className = 'row';
      const proc = b.processo ? b.processo : '⚠ sem processo';
      const peso = b.pesoKg ? ` · ${formatarTon(b.pesoKg)}` : '';
      row.innerHTML = `<span class="num">Bloco ${b.numero}${c?(' · '+c):''}${peso}</span><span class="meta">${proc}</span>`;
      lw.appendChild(row);
    });
  }

  function renderLiberacaoSec(content){
    const fin = b=>ESTADOS_FINAIS_PORTO.includes(b.estado);
    const lib = STATE.blocos.filter(b=>b.liberado);
    const porMover = lib.filter(b=>!fin(b)).length;
    const hist = STATE.listasExportacao || [];
    const inp = 'width:100%;border-radius:8px;border:1px solid var(--border-strong);padding:8px 10px;font-size:13px;background:var(--surface);color:var(--ink);margin-bottom:8px;';
    content.innerHTML = `
      <div class="panel">
        <p class="section-title">Listas da Exportação <span style="font-weight:400;color:var(--ink-mute);">— blocos com papelada completa</span></p>
        <div class="grid g3" style="margin-bottom:14px;">
          <div class="stat"><p class="label">Liberados</p><p class="value">${lib.length}</p></div>
          <div class="stat"><p class="label">Liberados por mover</p><p class="value">${porMover}</p></div>
          <div class="stat"><p class="label">Listas importadas</p><p class="value">${hist.length}</p></div>
        </div>
        <input id="lib-ref" placeholder="Referência da lista (ex: Lista Exportação 27/09)" style="${inp}height:38px;" />
        <textarea id="lib-txt" rows="5" placeholder="Cola os números dos blocos (um por linha, ou separados por vírgula/espaço)" style="${inp}font-family:var(--mono);"></textarea>
        <div style="display:flex;gap:8px;">
          <button class="btn success" id="lib-ok" style="flex:1;height:40px;">Liberar blocos</button>
          <button class="btn ghost" id="lib-off" style="height:40px;">Retirar liberação</button>
        </div>
        <div id="lib-res" style="margin-top:12px;"></div>
      </div>
      <div class="panel" style="margin-top:14px;">
        <p class="section-title">Histórico de listas</p>
        <div id="lib-hist"></div>
      </div>`;
    const res = content.querySelector('#lib-res');
    const acao = async modo => {
      const txt = content.querySelector('#lib-txt').value;
      if(!txt.trim()){ res.innerHTML = '<p style="font-size:12.5px;color:var(--rust);">Cola pelo menos um número de bloco.</p>'; return; }
      if(servidorLog()){
        const nums = [...new Set(String(txt).split(/[\s,;]+/).filter(x=>/^[A-Za-z0-9-]+$/.test(x)))];
        const ref = content.querySelector('#lib-ref').value.trim() || 'Lista sem referência';
        if(navigator.onLine===false){ res.innerHTML = '<p style="font-size:12.5px;color:var(--rust);">Sem rede — tenta quando tiveres ligação.</p>'; return; }
        res.innerHTML = '<p style="font-size:12.5px;color:var(--ink-mute);">A enviar…</p>';
        try{
          const {data,error} = await window.sb.rpc('aplicar_liberacao', { p_ref: ref, p_modo: modo, p_blocos: nums });
          if(error) throw error;
          if(data && data.erro){ res.innerHTML = `<p style="font-size:12.5px;color:var(--rust);">${data.erro}</p>`; return; }
          if(window.bfSincronizar) await window.bfSincronizar(false);
          const nf = data.nao_encontrados || [];
          const alvo = document.getElementById('lib-res');

      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = `<span class="num">${r.ref}</span><span class="meta">${r.modo==='liberar'?'liberou':'retirou'} ${r.aplicados}/${r.total}${r.naoEncontrados.length?(' · '+r.naoEncontrados.length+' não encontrado(s)'):''} · ${r.quando}</span>`;
      hw.appendChild(row);
    });
  }

  function renderEquipasSec(content){
    /* com login, a lista de motoristas/maquinistas vem do servidor e é gerida lá: editar aqui só alteraria a cópia do aparelho e perder-se-ia na sincronização */

      content.innerHTML = `<div class="panel"><p class="section-title">Equipas</p>
        <p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 8px;">As listas de motoristas e maquinistas são geridas no servidor (Supabase). Alterações feitas aqui não ficariam gravadas.</p>

    }
    content.innerHTML = `
      <div class="panel" style="margin-bottom:14px;">
        <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;" id="equipa-tipo-sel"></div>
        <button id="btn-nova-equipa" class="btn success small" style="margin-bottom:10px;">+ Adicionar</button>

        <div id="equipa-lista"></div>

      b.textContent = label;
      b.onclick = ()=>{ logEquipaTipo = val; logEquipaEdicao = null; render(); };
      tipoWrap.appendChild(b);
    });
    const ehMotorista = logEquipaTipo==='motoristas';
    const ehMaquinista = logEquipaTipo==='maquinistas';
    const ehLecturer = logEquipaTipo==='lecturers';
    const lista = STATE[logEquipaTipo];

    const campoId = ehMotorista ? 'matricula' : ehMaquinista ? 'locomotiva' : 'turno';
    const labelNome = ehMotorista ? 'Nome do motorista' : ehMaquinista ? 'Nome do maquinista' : 'Nome do lecturer';
    const labelId = ehMotorista ? 'Matrícula' : ehMaquinista ? 'Locomotiva' : 'Turno (DIA / NOITE)';
    const formArea = content.querySelector('#equipa-form-novo');
    const btnNovo = content.querySelector('#btn-nova-equipa');
    function renderForm(editIdx){
      const editando = editIdx!==null && editIdx!==undefined;
      const registo = editando ? lista[editIdx] : { [campoNome]:'', [campoId]:'' };
      formArea.innerHTML = `
        <div style="border:1px solid var(--border-strong);border-radius:10px;padding:10px;margin-bottom:10px;">
          <p style="font-size:12px;color:var(--ink-mute);margin:0 0 8px;">${editando ? 'A corrigir registo' : 'Novo registo'}</p>
          <input id="eq-nome" value="${registo[campoNome]||''}" placeholder="${labelNome}" style="width:100%;height:36px;border-radius:8px;border:1px solid var(--border-strong);padding:0 10px;font-size:13px;margin-bottom:6px;background:var(--surface);color:var(--ink);" />
          ${ehLecturer
            ? `<select id="eq-id" style="width:100%;height:36px;border-radius:8px;border:1px solid var(--border-strong);padding:0 10px;font-size:13px;margin-bottom:8px;background:var(--surface);color:var(--ink);"><option value="DIA" ${registo[campoId]==='DIA'?'selected':''}>DIA</option><option value="NOITE" ${registo[campoId]==='NOITE'?'selected':''}>NOITE</option></select>`
            : `<input id="eq-id" value="${registo[campoId]||''}" placeholder="${labelId}" style="width:100%;height:36px;border-radius:8px;border:1px solid var(--border-strong);padding:0 10px;font-size:13px;font-family:var(--mono);margin-bottom:8px;background:var(--surface);color:var(--ink);" />`}
          <p id="eq-warn" style="font-size:11.5px;margin:0 0 8px;display:none;color:var(--rust);"></p>
          <div style="display:flex;gap:6px;"><button id="eq-guardar" class="btn primary small" style="flex:1;">Guardar</button><button id="eq-cancelar" class="btn ghost small">Cancelar</button></div>
          ${(registo.historico&&registo.historico.length) ? `
            <p style="font-size:11px;color:var(--ink-mute);margin:10px 0 4px;">Histórico</p>
            <div style="display:flex;flex-direction:column;gap:3px;">${registo.historico.slice().reverse().map(h=>`<p style="font-size:11px;color:var(--ink-soft);margin:0;">${h.quando} · ${h.campo}: ${h.de===null?'(vazio)':h.de} → ${h.para===null?'(vazio)':h.para}</p>`).join('')}</div>
          ` : ''}
        </div>
      `;
      formArea.querySelector('#eq-cancelar').onclick = ()=>{ logEquipaEdicao = null; render(); };
      formArea.querySelector('#eq-guardar').onclick = ()=>{
        const novoNome = formArea.querySelector('#eq-nome').value.trim();
        const novoId = formArea.querySelector('#eq-id').value.trim();
        const warn = formArea.querySelector('#eq-warn'); warn.style.display = 'none';
        if(!novoNome || !novoId){ warn.textContent = 'Preenche o nome e a identificação.'; warn.style.display='block'; return; }
        const duplicado = !ehLecturer && lista.some((r,i)=> r[campoId]===novoId && i!==editIdx);
        if(duplicado){ warn.textContent = `${labelId} "${novoId}" já está atribuída a outro registo.`; warn.style.display='block'; return; }
        if(editando){
          registo.historico = registo.historico || [];
          if(novoNome !== registo[campoNome]) registo.historico.push({campo:'nome', de:registo[campoNome], para:novoNome, quando:agoraISO()+' '+nowStr()});
          if(novoId !== registo[campoId]) registo.historico.push({campo:labelId.toLowerCase(), de:registo[campoId], para:novoId, quando:agoraISO()+' '+nowStr()});
          registo[campoNome] = novoNome; registo[campoId] = novoId;
        } else {
          const novo = { [campoNome]:novoNome, [campoId]:novoId, activo:true, historico:[] };
          novo.historico.push({campo:'criação', de:null, para:novoNome, quando:agoraISO()+' '+nowStr()});
          lista.push(novo); lista.sort((a,b)=> a[campoNome].localeCompare(b[campoNome]));
        }
        logEquipaEdicao = null; render();
      };
    }
    btnNovo.onclick = ()=>{ logEquipaEdicao = null; renderForm(null); };
    if(logEquipaEdicao!==null){ renderForm(logEquipaEdicao); }
    const listaWrap = content.querySelector('#equipa-lista');
    if(lista.length===0) listaWrap.innerHTML = '<p style="font-size:12.5px;color:var(--ink-mute);">Ainda sem registos.</p>';
    lista.forEach((r,i)=>{
      const wrap = document.createElement('div');
      wrap.style.cssText = 'margin-bottom:8px;' + (r.activo===false ? 'opacity:0.55;' : '');
      const row = document.createElement('div');
      row.className = 'row'; row.style.marginBottom = '4px';
      row.innerHTML = `<span class="num" style="font-family:var(--sans);font-weight:600;">${r[campoNome]}${r.activo===false?' (inactivo)':''}</span><span class="meta" style="font-family:var(--mono);">${r[campoId]}</span>`;
      const acoes = document.createElement('div');
      acoes.style.cssText = 'display:flex;gap:4px;';
      const btnEd = document.createElement('button'); btnEd.className = 'btn ghost small'; btnEd.textContent = 'Editar';
      btnEd.onclick = ()=>{ logEquipaEdicao = i; render(); };
      const btnTog = document.createElement('button'); btnTog.className = 'btn ghost small'; btnTog.textContent = r.activo===false ? 'Reactivar' : 'Desactivar';
      btnTog.onclick = ()=>{
        r.historico = r.historico || [];
        r.historico.push({campo:'estado', de: r.activo===false?'inactivo':'activo', para: r.activo===false?'activo':'inactivo', quando:agoraISO()+' '+nowStr()});
        r.activo = r.activo===false ? true : false; render();
      };
      acoes.appendChild(btnEd); acoes.appendChild(btnTog);
      wrap.appendChild(row); wrap.appendChild(acoes); listaWrap.appendChild(wrap);
    });
  }

  function renderRelatoriosSec(content){
    const hoje = agoraISO();
    const dias = diasComDados();
    content.innerHTML = `
      <div class="panel" style="margin-bottom:14px;">

      </div>
    `;

    function card({ id, titulo, desc }){
      const wrap = document.createElement('div');
      wrap.style.cssText = 'border:1px solid var(--border);border-radius:10px;padding:14px;background:var(--surface-2);';
      wrap.innerHTML = `
        <p style="font-size:14px;font-weight:600;margin:0 0 4px;">${titulo}</p>
        <p style="font-size:12px;color:var(--ink-soft);margin:0 0 10px;">${desc}</p>

        <button id="btn-${id}" class="btn primary small" style="margin-top:10px;">Gerar PDF</button>
      `;
      return wrap;
    }
    function criarChipsDias(container, inputData){
      container.innerHTML = '';
      if(dias.length===0){
        const lbl = document.createElement('span');
        lbl.className = 'lbl';
        lbl.textContent = 'Sem dados ainda.';
        container.appendChild(lbl);
        return;
      }
      const lbl = document.createElement('span');
      lbl.className = 'lbl';
      lbl.textContent = 'Dias com dados:';
      container.appendChild(lbl);
      dias.slice(0, 8).forEach(d=>{
        const b = document.createElement('button');
        b.textContent = relDataLonga(d);
        if(inputData.value === d) b.classList.add('activo');
        b.onclick = ()=>{
          inputData.value = d;
          [...container.querySelectorAll('button')].forEach(x=> x.classList.remove('activo'));
          b.classList.add('activo');
        };
        container.appendChild(b);
      });
    }

    /* 1. Rotas */
    const c1 = card({ id:'rotas', titulo:'Rotas — Quantidades por elo', desc:'Escolhe o período e, se quiseres, um elo. Sem elo: quadro geral motorista × rota (para a Direção). Com elo: resumo, motoristas e a lista de viagens com os blocos e a confirmação de chegada.' });

    const inp1b = document.createElement('input'); inp1b.type = 'date'; inp1b.value = hoje; inp1b.style.cssText = estiloInp;
    const selElo = document.createElement('select'); selElo.style.cssText = estiloInp;
    selElo.innerHTML = '<option value="">Todos os elos (quadro geral)</option>' + elosExistentes().map(e=>`<option value="${e}">${e}</option>`).join('');
    campos1.appendChild(document.createTextNode('De: ')); campos1.appendChild(inp1);
    campos1.appendChild(document.createTextNode(' até: ')); campos1.appendChild(inp1b);
    campos1.appendChild(document.createTextNode(' Elo: ')); campos1.appendChild(selElo);
    const proxyDia = { get value(){ return inp1.value; }, set value(v){ inp1.value = v; inp1b.value = v; } };
    criarChipsDias(c1.querySelector('#chips-rotas'), proxyDia);
    c1.querySelector('#btn-rotas').onclick = ()=>{
      let ini = inp1.value, fim = inp1b.value || inp1.value; if(fim < ini){ const t = ini; ini = fim; fim = t; }
      if(selElo.value){
        const r = relElo(ini, fim, selElo.value);
        abrirRelatorio({ titulo:'Relatório por Elo', subtitulo: selElo.value+' · '+relPeriodoTxt(ini,fim), corpo:r.corpo, landscape:r.landscape });
      } else {
        const r = relRotas(ini, fim);
        abrirRelatorio({ titulo:'Relatório de Rotas', subtitulo:'Blocos por motorista e elo · '+relPeriodoTxt(ini,fim), corpo:r.corpo, landscape:r.landscape });

    sel2.innerHTML = `<option value="">— todas as missões activas —</option>` + STATE.missoes.map(m=>`<option value="${m.id}">${m.navio} · ${m.id}</option>`).join('');
    campos2.appendChild(document.createTextNode('Missão: '));
    campos2.appendChild(sel2);
    c2.querySelector('#chips-carreg').style.display = 'none';
    c2.querySelector('#btn-carreg').onclick = ()=>{
      const mid = sel2.value || null;
      const r = relCarregamento(mid);
      const miss = mid ? missaoPorId(mid) : null;
      abrirRelatorio({ titulo:'Relatório de Carregamento', subtitulo: miss ? (miss.navio+' · '+miss.id) : 'Todos os embarques registados', corpo:r.corpo, landscape:r.landscape });
    };

    /* 3. Chibia */
    const c3 = card({ id:'chibia', titulo:'Mapa de Entrada — Chibia', desc:'Diário. Lista de blocos entrados no Estaleiro da Chibia, com motorista, guia e cliente.' });
    cards.appendChild(c3);
    const campos3 = c3.querySelector('#campos-chibia');
    const inp3 = document.createElement('input');
    inp3.type = 'date'; inp3.value = hoje;
    inp3.style.cssText = 'height:34px;border-radius:8px;border:1px solid var(--border-strong);padding:0 8px;font-size:13px;background:var(--surface);color:var(--ink);';
    campos3.appendChild(document.createTextNode('Data: '));

    c3.querySelector('#btn-chibia').onclick = ()=>{
      const r = relMapaChibia(inp3.value);
      abrirRelatorio({ titulo:'Mapa de Entrada — Chibia', subtitulo: relDataLonga(inp3.value), corpo:r.corpo, landscape:r.landscape });
    };

    /* 4. Daily Report */
    const c4 = card({ id:'daily', titulo:'Daily Report — Carregamento', desc:'Por missão. Estrutura alinhada com o do armador: Qty e Tons por porão. Horas FM/TO e lecturer a completar no papel.' });
    cards.appendChild(c4);
    const campos4 = c4.querySelector('#campos-daily');
    const sel4 = document.createElement('select');

    sel4.innerHTML = `<option value="">— todas as missões activas —</option>` + STATE.missoes.map(m=>`<option value="${m.id}">${m.navio} · ${m.id}</option>`).join('');
    campos4.appendChild(document.createTextNode('Missão: '));
    campos4.appendChild(sel4);
    c4.querySelector('#chips-daily').style.display = 'none';
    c4.querySelector('#btn-daily').onclick = ()=>{
      const mid = sel4.value || null;
      const r = relDailyReport(mid);
      const miss = mid ? missaoPorId(mid) : null;
      abrirRelatorio({ titulo:'Daily Report — Granit Cargo Operations', subtitulo: miss ? (miss.navio+' · '+miss.id) : 'Todos os embarques registados', corpo:r.corpo, landscape:r.landscape });
    };
  }

          <p class="section-title">Contentor</p>
          <input id="correcao-contentor" value="${b.contentor||''}" placeholder="Ex: CT-1042" style="width:100%;height:36px;border-radius:8px;border:1px solid var(--border-strong);padding:0 10px;font-size:13px;font-family:var(--mono);margin-bottom:10px;background:var(--surface);color:var(--ink);" />
          ${servidorLog() ? `<input id="correcao-motivo" placeholder="Motivo da correção (obrigatório)" style="width:100%;height:36px;border-radius:8px;border:1px solid var(--border-strong);padding:0 10px;font-size:13px;margin-bottom:8px;background:var(--surface);color:var(--ink);" /><p id="correcao-warn" style="font-size:11.5px;margin:0 0 8px;display:none;color:var(--rust);"></p>` : ''}
          <div style="display:flex;gap:6px;">
            <button id="btn-guardar-correcao" class="btn primary small" style="flex:1;">Guardar</button>
            <button id="btn-cancelar-correcao" class="btn ghost small">Cancelar</button>
          </div>
          <p style="font-size:11.5px;color:var(--ink-mute);margin:8px 0 0;">A anulação de blocos é feita pela Produção (até à Chibia).</p>
          ${(b.historicoLogistica&&b.historicoLogistica.length) ? `
            <p style="font-size:11px;color:var(--ink-mute);margin:10px 0 4px;">Correcções anteriores</p>
            <div style="display:flex;flex-direction:column;gap:3px;">${b.historicoLogistica.slice().reverse().map(h=>`<p style="font-size:11px;color:var(--ink-soft);margin:0;">${h.quando} · ${h.campo}: ${h.de===null?'(vazio)':h.de} → ${h.para===null?'(vazio)':h.para}</p>`).join('')}</div>
          ` : ''}
        </div>
      `;
      let novoLocal = b.local;
      const postosWrap = correcaoArea.querySelector('#correcao-postos');
      const TODOS_POSTOS = ['Mingue', ...ORIGENS_BAIXA_ATIVIDADE, ...POSTOS];
      TODOS_POSTOS.forEach(p=>{
        const btn = document.createElement('button');
        btn.className = 'btn small ' + (novoLocal===p ? 'primary' : 'ghost');
        btn.textContent = p;
        btn.onclick = ()=>{ novoLocal = p; renderCorrecao(); };
        postosWrap.appendChild(btn);
      });
      const inpProc = correcaoArea.querySelector('#correcao-processo');
      const sugProc = correcaoArea.querySelector('#correcao-proc-sug');
      function actualizarSugestao(){
        const cod = inpProc.value.trim().toUpperCase();
        sugProc.innerHTML = '';
        if(!cod) return;
        const proc = STATE.processos.find(p=>p.codigo===cod);
        const p = document.createElement('p');
        if(proc){ p.style.cssText = 'font-size:11.5px;color:var(--moss);margin:0;'; p.textContent = `✓ Processo registado — cliente ${proc.cliente}${proc.porConfirmar?' · ⚠ por confirmar':''}`; }
        else { p.style.cssText = 'font-size:11.5px;color:var(--amber);margin:0;'; p.textContent = '⚠ Processo não existe — confirma na Produção.'; }
        sugProc.appendChild(p);
      }
      actualizarSugestao();
      inpProc.addEventListener('input', actualizarSugestao);
      correcaoArea.querySelector('#btn-cancelar-correcao').onclick = ()=>{ logCorrecaoNum=null; render(); };
      const btnAnularLog = correcaoArea.querySelector('#btn-anular-log');
      if(btnAnularLog){
        btnAnularLog.onclick = async ()=>{
          if(!confirm(`Anular o bloco ${b.numero}?`)) return;
          if(servidorLog()){
            const warn = correcaoArea.querySelector('#correcao-warn'); const motivo = (correcaoArea.querySelector('#correcao-motivo').value||'').trim();
            if(!motivo){ warn.textContent = 'Indica o motivo da anulação.'; warn.style.display='block'; return; }
            const r = await corrigirNoServidor({ numero:b.numero, motivo, anular:true });
            if(r.erro){ warn.textContent = r.erro; warn.style.display='block'; return; }
            if(window.bfSincronizar) await window.bfSincronizar(false);
            if(window.celebrar) window.celebrar('Bloco anulado', `Bloco ${b.numero}`); return;
          }
          b.historicoLogistica = b.historicoLogistica || [];
          b.historicoLogistica.push({ campo:'estado', de:b.estado, para:'anulado', quando:agoraISO()+' '+nowStr() });
          b.estado = 'anulado'; render();
        };
      }
      correcaoArea.querySelector('#btn-guardar-correcao').onclick = async ()=>{
        const novoProcesso = inpProc.value.trim().toUpperCase() || null;
        const novoContentor = correcaoArea.querySelector('#correcao-contentor').value.trim() || null;
        if(servidorLog()){
          const warn = correcaoArea.querySelector('#correcao-warn'); warn.style.display = 'none';
          const motivo = (correcaoArea.querySelector('#correcao-motivo').value||'').trim();
          const p = { numero:b.numero, motivo };
          if(novoLocal !== b.local) p.local = novoLocal;
          if(novoProcesso !== b.processo) p.processo = novoProcesso || '';
          if(novoContentor !== b.contentor) p.contentor = novoContentor || '';
          if(Object.keys(p).length <= 2){ warn.textContent = 'Nada foi alterado.'; warn.style.display='block'; return; }
          if(!motivo){ warn.textContent = 'Indica o motivo da correção.'; warn.style.display='block'; return; }
          const r = await corrigirNoServidor(p);
          if(r.erro){ warn.textContent = r.erro; warn.style.display='block'; return; }
          if(window.bfSincronizar) await window.bfSincronizar(false);
          if(window.celebrar) window.celebrar('Correção gravada', `Bloco ${b.numero}`); return;
        }
        b.historicoLogistica = b.historicoLogistica || [];
        let mudou = false;
        if(novoLocal !== b.local){ b.historicoLogistica.push({ campo:'localização', de:b.local, para:novoLocal, quando:agoraISO()+' '+nowStr() }); b.local = novoLocal; b.divergencia = false; mudou = true; }
        if(novoProcesso !== b.processo){
          b.historicoLogistica.push({campo:'processo', de:b.processo, para:novoProcesso, quando:agoraISO()+' '+nowStr()});
          b.processo = novoProcesso;
          const proc = novoProcesso && STATE.processos.find(p=>p.codigo===novoProcesso);
          if(proc && proc.porConfirmar) proc.porConfirmar = false;
          mudou = true;
        }
        if(novoContentor !== b.contentor){ b.historicoLogistica.push({campo:'contentor', de:b.contentor, para:novoContentor, quando:agoraISO()+' '+nowStr()}); b.contentor = novoContentor; mudou = true; }
        if(!mudou) return;
        render();
      };
    }
    buscaCorrecao.addEventListener('input', ()=>{
      const q = buscaCorrecao.value.trim();
      logCorrecaoNum = STATE.blocos.some(x=>x.numero===q) ? q : null;
      renderCorrecao();
    });
    renderCorrecao();
  }

  return el;
}


/* ---------------- RENDER PRINCIPAL ---------------- */
function render(){
  renderRoles();
  $view.innerHTML = '';
  let node;
  if(role==='producao') node = viewProducao();
  else if(role==='conferente') node = viewConferente();
  else if(role==='transportes') node = viewTransportes();
  else if(role==='diretor') node = viewDiretor();
  else node = viewLogistica();
  $view.appendChild(node);
  renderSalaFab();
}

function renderSalaFab(){
  const badge = document.getElementById('sala-fab-badge');
  const total = window.bfSala ? window.bfSala.naoLidas() : (STATE.sala||[]).length;
  if(total>0){ badge.style.display='flex'; badge.textContent = total>99?'99+':total; }
  else badge.style.display='none';
}
function abrirSala(){
  document.getElementById('sala-overlay').style.display = 'block';
  renderSalaDrawer();
}
function fecharSala(){
  document.getElementById('sala-overlay').style.display = 'none';
}
let salaUltimaVista = null, salaNMsgs = 0;
function renderSalaDrawer(forcarFundo){
  const body = document.getElementById('sala-drawer-body');
  const mwAnt = document.getElementById('sala-msgs');
  const perto = !mwAnt || (mwAnt.scrollHeight - mwAnt.scrollTop - mwAnt.clientHeight < 90);
  const topoAnt = mwAnt ? mwAnt.scrollTop : 0;
  const mudouSala = salaUltimaVista !== salaProc; salaUltimaVista = salaProc;
  const nAntes = salaNMsgs; salaNMsgs = (STATE.sala||[]).filter(m=>m.processo===salaProc).length;
  const ant = document.getElementById('sala-txt'); const val = ant ? ant.value : ''; const tinhaFoco = !!ant && document.activeElement===ant; const pos = ant ? ant.selectionStart : null;
  body.innerHTML = '';
  body.appendChild(viewSala());
  const nov = document.getElementById('sala-txt');
  if(nov && val){ nov.value = val; if(tinhaFoco){ nov.focus(); try{ nov.setSelectionRange(pos,pos); }catch(e){} } }
  const mw = document.getElementById('sala-msgs');
  if(mw){
    const fundo = ()=>{ mw.scrollTop = mw.scrollHeight; };
    if(forcarFundo || perto || mudouSala){ fundo(); setTimeout(fundo,0); }
    else{
      mw.scrollTop = topoAnt;
      if(salaNMsgs > nAntes){
        const b = document.createElement('button'); b.type='button'; b.className='btn small'; b.id='sala-novas';
        b.style.cssText = 'display:block;margin:-4px auto 8px;position:relative;z-index:2;background:var(--slate);color:#fff;border-radius:16px;';
        b.textContent = '↓ Novas mensagens'; b.onclick = ()=>{ fundo(); b.remove(); };
        mw.parentNode.insertBefore(b, mw.nextSibling);
        mw.addEventListener('scroll', ()=>{ if(mw.scrollHeight - mw.scrollTop - mw.clientHeight < 90) b.remove(); });
      }
    }
  }
}
document.getElementById('sala-fab').onclick = abrirSala;
document.getElementById('sala-close').onclick = fecharSala;
document.getElementById('sala-overlay').addEventListener('click', e=>{ if(e.target.id==='sala-overlay') fecharSala(); });

(function(){ const tb=document.querySelector('.topbar'); if(!tb) return;
  const set=()=>document.documentElement.style.setProperty('--topbar-h', tb.offsetHeight+'px');
  set(); if(window.ResizeObserver) new ResizeObserver(set).observe(tb); window.addEventListener('resize',set); })();
render();
</script>

<script>
