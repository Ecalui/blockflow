<style>
  :root{
    --bg:#E7E5DD;--surface:#FBFBF9;--surface-2:#F1EFE8;--border:#C7C1B2;--border-strong:#8F8878;
    --ink:#14181A;--ink-soft:#403E36;--ink-mute:#736E5E;--slate:#2F5470;--slate-ink:#FFFFFF;
    --amber:#8A5E0B;--amber-bg:#F3E1BC;--moss:#3E6E4E;--moss-bg:#DCEAE0;--rust:#9E3B2C;--rust-bg:#F3DAD3;
    --radius:8px;--mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  body{min-height:100vh;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  .app{max-width:1100px;margin:0 auto;padding:20px 18px 60px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark-img{height:34px;width:auto;display:block;flex:0 0 auto;padding-right:12px;margin-right:2px;border-right:2px solid var(--slate);box-sizing:content-box;}
  .brand .mark{width:30px;height:30px;background:var(--slate);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;font-family:var(--mono);}
  .brand .title{font-size:15px;font-weight:300;color:#1F3A50;}
  .brand .title .f{font-weight:700;}
  .brand .subtitle{font-size:11.5px;color:var(--ink-mute);}

  .roles{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:10px;border:1px solid var(--border);flex-wrap:wrap;}
  .roles button{border:none;background:transparent;padding:8px 12px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--ink-soft);}
  .roles button.active{background:var(--slate);color:#fff;}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;}
  .grid{display:grid;gap:12px;}
  .g2{grid-template-columns:1fr 1fr;}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:640px){ .g3,.g4{grid-template-columns:repeat(2,1fr);} }

  .stat{background:var(--surface-2);border-radius:var(--radius);padding:12px 14px;border:1px solid var(--border);}
  @keyframes livepulse{0%{opacity:1;}50%{opacity:.35;}100%{opacity:1;}}
  .live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--moss);animation:livepulse 1.6s ease-in-out infinite;margin-left:5px;vertical-align:middle;}
  .hub-card{background:var(--surface-2);border-radius:var(--radius);padding:12px 14px;border:1px solid var(--border);cursor:pointer;}
  .hub-card.destaque{border-color:var(--slate);border-width:1.5px;box-shadow:inset 0 0 0 1px rgba(47,84,112,.08);}
  .hub-card .hub-label{font-size:11.5px;color:var(--ink-soft);margin:0 0 2px;display:flex;align-items:center;}
  .hub-card .hub-total{font-size:26px;font-weight:600;font-family:var(--mono);margin:0 0 2px;line-height:1;}
  .hub-card .hub-tons{font-size:13px;font-family:var(--mono);font-weight:600;color:var(--slate);margin:0 0 8px;}
  .hub-card .hub-breakdown{display:flex;flex-direction:column;gap:2px;}
  .hub-card .hub-breakdown span{font-size:11px;color:var(--ink-mute);display:flex;justify-content:space-between;gap:6px;}
  .hub-card .hub-breakdown b{color:var(--ink-soft);font-weight:600;font-family:var(--mono);}
  .stat .label{font-size:11.5px;color:var(--ink-soft);margin:0 0 4px;}
  .stat .value{font-size:22px;font-weight:600;margin:0;font-family:var(--mono);}
  .stat .sub{font-size:11.5px;color:var(--slate);font-family:var(--mono);font-weight:600;margin:2px 0 0;}
  .stat.warn{background:var(--amber-bg);}
  .stat.warn .value{color:var(--amber);}
  .stat.warn .label{color:#8A5E0B;}
  .stat.risk{background:var(--rust-bg);}
  .stat.risk .value{color:var(--rust);}
  .stat.risk .label{color:#7A2B1F;}
  .stat.ok{background:var(--moss-bg);}
  .stat.ok .value{color:var(--moss);}
  .stat.ok .label{color:#2C4F37;}
  .elo-tile{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;}
  .elo-tile.destaque{background:var(--moss-bg);border-color:var(--moss);}
  .elo-tile .num{font-size:20px;font-weight:700;font-family:var(--mono);margin:0;line-height:1.1;}
  .elo-tile .nome{font-size:10.5px;color:var(--ink-mute);margin:2px 0 0;line-height:1.25;}
  .elo-tile.destaque .nome{color:#2C4F37;}

  .section-title{font-size:12px;color:var(--ink-soft);margin:0 0 8px;font-weight:600;}
  .passo-n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--border-strong);color:#fff;font-size:12px;font-weight:700;margin-right:8px;vertical-align:middle;}
  .section-title.passo-ok{color:var(--ink-mute);font-weight:500;}
  .section-title.passo-ok .passo-n{background:var(--moss);}
  .section-title.passo-atual{color:var(--ink);font-size:13.5px;background:var(--amber-bg);border-left:4px solid var(--slate);border-radius:6px;padding:7px 8px;}
  .section-title.passo-atual .passo-n{background:var(--slate);}
  .section-title.passo-flash{animation:passoFlash 1.2s ease 1;}
  @keyframes passoFlash{0%,100%{box-shadow:none}30%,70%{box-shadow:0 0 0 4px rgba(176,122,18,.45);}}
  #passos-barra{position:sticky;top:0;z-index:5;background:var(--surface);padding:8px 0 10px;margin:0 0 10px;}
  #passos-barra .passos-txt{font-size:13px;color:var(--ink);margin-bottom:6px;}
  #passos-barra .passos-seg{display:flex;gap:4px;}
  #passos-barra .passos-seg i{flex:1;height:6px;border-radius:3px;background:var(--border-strong);opacity:.45;}
  #passos-barra .passos-seg i.ok{background:var(--moss);opacity:1;}
  #passos-barra .passos-seg i.atual{background:var(--slate);opacity:1;}
  .passo-resumo{display:flex;align-items:center;gap:10px;border:1px solid var(--moss);background:var(--moss-bg);border-radius:8px;padding:8px 10px;margin:0 0 10px;}
  .passo-resumo .passo-n{background:var(--moss);margin:0;flex:none;}
  .passo-resumo-txt{flex:1;min-width:0;}
  .passo-resumo-lbl{font-size:11px;color:var(--ink-mute);}
  .passo-resumo-val{font-size:13.5px;font-weight:600;color:var(--ink);overflow-wrap:anywhere;}
  .bar-outer{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--border);}
  .bar-inner{height:100%;background:var(--slate);}
  .bar-inner.warn{background:var(--amber);}
  .bar-inner.ok{background:var(--moss);}

  .row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--surface-2);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:6px;}
  .row .num{font-family:var(--mono);font-weight:600;font-size:13.5px;}
  .row .meta{font-size:11.5px;color:var(--ink-mute);}
  .row.expandivel{cursor:pointer;}
  .row.expandivel:hover{border-color:var(--border-strong);}

  .badge{font-size:11px;padding:3px 9px;border-radius:999px;font-weight:600;}
  .badge.ok{background:var(--moss-bg);color:var(--moss);}
  .badge.warn{background:var(--amber-bg);color:var(--amber);}
  .badge.danger{background:var(--rust-bg);color:var(--rust);}

  .btn{border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;padding:8px 14px;}
  .btn.primary{background:var(--slate);border-color:var(--slate);color:#fff;}
  .btn.success{background:var(--moss);border-color:var(--moss);color:#fff;}
  .btn.ghost{background:transparent;border:1px solid var(--border-strong);}
  .btn.small{padding:5px 9px;font-size:12px;border-radius:7px;}
  .btn.icon{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;font-size:15px;}
  .btn:disabled{opacity:.4;cursor:default;}

  .alert{display:flex;gap:10px;padding:12px 14px;border-radius:var(--radius);align-items:flex-start;}
  .alert.warn{background:var(--amber-bg);color:#7A5209;}
  .alert.ok{background:var(--moss-bg);color:#2C4F37;}
  .alert p{margin:0;font-size:12.5px;line-height:1.4;}
  .alert strong{font-size:13px;}

  .phone-wrap{display:flex;justify-content:center;}
  .phone{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:22px;overflow:hidden;position:relative;}
  .flash-overlay{position:absolute;inset:0;background:var(--moss);opacity:0;pointer-events:none;transition:opacity .15s ease;z-index:5;}
  .flash-overlay.on{opacity:.30;transition:opacity .06s ease;}
  .flash-overlay.on.err{background:var(--rust);opacity:.34;}
  .campo-bloco{position:relative;flex:1;}
  .campo-bloco input{width:100%;box-sizing:border-box;}
  .campo-bloco .icone-estado{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:18px;font-weight:700;line-height:1;pointer-events:none;}
  .toast{cursor:pointer;}
  .phone-head{background:var(--slate);color:#fff;padding:14px 16px;}
  .phone-head .m1{font-size:11.5px;opacity:.8;margin:0 0 2px;}
  .phone-head .m2{font-size:16px;font-weight:600;margin:0;}
  .phone-body{padding:16px;}
  .modebar{display:flex;gap:8px;margin-bottom:14px;}
  .modebar button{flex:1;height:42px;border-radius:10px;font-size:13.5px;font-weight:600;border:1.5px solid var(--border-strong);background:transparent;color:var(--ink);}
  .modebar button.on-entrada{background:var(--moss);border-color:var(--moss);color:#fff;}
  .modebar button.on-saida{background:var(--slate);border-color:var(--slate);color:#fff;}
  .toast{margin-top:10px;padding:9px 10px;border-radius:var(--radius);font-size:12.5px;text-align:center;}
  .toast.ok{background:var(--moss-bg);color:var(--moss);}
  .toast.err{background:var(--rust-bg);color:var(--rust);}

  .search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:10px;padding:0 12px;height:42px;margin-bottom:14px;}
  .search input{border:none;background:transparent;outline:none;font-size:13.5px;flex:1;color:var(--ink);}

  .missions-list .mission-card{border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;background:var(--surface-2);cursor:pointer;}
  .missions-list .mission-card.risk{border-color:var(--amber);}
  .missions-list .mission-card.planned{opacity:.6;cursor:default;}
  .mc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
  .mc-name{font-size:14px;font-weight:600;margin:0;}
  .mc-sub{font-size:12px;color:var(--ink-soft);margin:2px 0 0;}

  .backbtn{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);background:none;border:none;padding:0 0 10px;font-weight:500;}

  .foot-note{font-size:11.5px;color:var(--ink-mute);margin-top:18px;text-align:center;}

  .medida-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:4px;}
  .medida-grid input{width:100%;height:38px;border-radius:8px;border:1px solid var(--border-strong);padding:0 8px;font-size:13px;font-family:var(--mono);background:var(--surface);color:var(--ink);text-align:center;}
  .peso-preview{font-size:12px;color:var(--moss);font-family:var(--mono);margin:0 0 14px;font-weight:600;}
  .peso-preview.vazio{color:var(--ink-mute);font-weight:400;}

  .chips-dias{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 0;}
  .chips-dias button{background:var(--surface);border:1px solid var(--border-strong);padding:4px 8px;border-radius:999px;font-size:11.5px;font-family:var(--mono);color:var(--ink-soft);}
  .chips-dias button:hover{border-color:var(--slate);color:var(--slate);}
  .chips-dias button.activo{background:var(--slate);color:#fff;border-color:var(--slate);}
  .chips-dias .lbl{font-size:11px;color:var(--ink-mute);align-self:center;margin-right:4px;}

  /* ===== RESPONSIVIDADE (v1 responsivo) ===== */
  .phone-wrap{align-items:flex-start;}
  @media (min-width:768px){
    .phone{max-width:560px;}
    .phone.phone-web{max-width:820px;border-radius:14px;}
    .phone.phone-web .phone-body{padding:22px 24px;}
  }
  @media (min-width:1024px){ .phone.phone-web{max-width:900px;} }

  /* ===== ECRÃ PREENCHE O APARELHO (sem moldura de telefone) ===== */
  html,body{overscroll-behavior:none;}
  body{overflow-x:hidden;touch-action:pan-y pinch-zoom;}
  body.kiosk .topbar .roles{display:none;}
  @media (min-width:641px){
    .phone{border-radius:12px;}
    .phone.phone-web{border-radius:12px;}
  }
  @media (max-width:640px){
    .phone-wrap{margin:0 -12px;}
    .phone{max-width:none !important;width:100%;border-radius:0;border-left:0;border-right:0;overflow:visible;}
    .phone-head{position:sticky;top:0;z-index:20;border-radius:0;}
    .phone-body{padding:14px 12px 24px;}
    body.kiosk .phone{min-height:calc(100dvh - 64px);}
  }

  /* ===== CABEÇALHO FIXO (marca + seletor de papéis sempre visíveis) ===== */
  html{scroll-padding-top:var(--topbar-h,0px);}
  .topbar{position:sticky;top:0;z-index:50;background:var(--bg);margin:0 -18px 14px;padding:10px 18px;box-shadow:0 1px 0 var(--border);}
  .roles{position:relative;}
  @media (min-width:641px){
    #tr-nav,#dir-nav,#log-nav{top:calc(var(--topbar-h,0px) + 10px) !important;}
  }
  @media (max-width:640px){
    .topbar{margin:0 -12px 12px;padding:8px 12px;gap:8px;}
    .brand .subtitle{font-size:10.5px;}
    .roles{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .roles::-webkit-scrollbar{display:none;}
    .roles button{white-space:nowrap;flex:0 0 auto;}
    .phone-head{top:var(--topbar-h,0px) !important;}
  }
  #sala-drawer input,#sala-drawer select{min-width:0;}
  @media (max-width:900px){
    #tr-content,#dir-content,#log-content{min-width:0 !important;}
  }
  @media (max-width:640px){
    .app{padding:14px 12px 70px;}
    .topbar{gap:10px;}
    .topbar .roles{width:100%;}
    .roles button{padding:7px 10px;font-size:12px;}
    .row{gap:10px;}
    .row .meta{text-align:right;}
    #tr-nav,#dir-nav,#log-nav{max-width:none !important;min-width:0 !important;width:100% !important;flex-wrap:nowrap !important;overflow-x:auto;position:static !important;scrollbar-width:none;}
    #tr-nav::-webkit-scrollbar,#dir-nav::-webkit-scrollbar,#log-nav::-webkit-scrollbar{display:none;}
    #tr-nav > button,#dir-nav > button,#log-nav > button{width:auto !important;flex:0 0 auto !important;white-space:nowrap;}
    #tr-content,#dir-content,#log-content{width:100%;flex:1 1 100% !important;}
    .row.expandivel{flex-direction:column;align-items:flex-start;gap:4px;}
    .row.expandivel .num{font-size:12.5px;overflow-wrap:anywhere;}
    .panel{padding:14px;}
    #sala-fab{right:14px !important;bottom:14px !important;}
  }
</style>
</head>
<body>
<div class="app">

const DENSIDADE_GRANITO = 2.80;

/* escapa texto vindo do servidor ou digitado antes de o meter em HTML */
function escH(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const STATE = {
  meta: {

(function backfillProcessos(){
  const EXCECOES = new Set(['66349','66484','67168']);
  const alternar = ['FUY0724','JF2425'];
  let i = 0;
  STATE.blocos.forEach(b=>{
    if(!b.processo && !EXCECOES.has(b.numero)) b.processo = alternar[i++ % 2];
    delete b.cliente;
  });
})();

(function backfillMedidas(){
  STATE.blocos.forEach(b=>{
    if(b.pesoKg) return;
    const seed = parseInt(b.numero, 10) || 10000;
    const comp = 2.5 + (seed % 8) * 0.1;
    const alt  = 1.3 + ((seed >> 2) % 8) * 0.09;
    const larg = 0.9 + ((seed >> 3) % 10) * 0.10;
    const cbm  = +(comp * alt * larg).toFixed(2);
    b.compM = +comp.toFixed(2); b.altM = +alt.toFixed(2); b.largM = +larg.toFixed(2);
    b.cbm = cbm;
    b.pesoKg = Math.round(cbm * DENSIDADE_GRANITO * 1000);
  });
})();

/* ---- PERSISTÊNCIA LOCAL (ponte até ao Supabase) ---- */
(function persistencia(){
  const KEY='bf_estado_v1', KEYS=['clientes','processos','blocos','guias','guiasUsadas','ultimo','ultimoComboio','ultimaGuia','listasExportacao','missoes','motoristas','maquinistas'];
  const ser = ()=>{ const o={v:1, gravadoEm:new Date().toISOString()}; KEYS.forEach(k=>{ o[k] = STATE[k] instanceof Set ? [...STATE[k]] : STATE[k]; }); return JSON.stringify(o); };
  const aplicar = o=>{ KEYS.forEach(k=>{ if(o[k]===undefined) return; STATE[k] = (k==='guiasUsadas') ? new Set(o[k]) : o[k]; }); };
  try{ const raw=localStorage.getItem(KEY); if(raw) aplicar(JSON.parse(raw)); }catch(e){ console.warn('Estado local ilegível', e); }
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  let ultimo = null;
  const hh = ()=>{ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
  function barra(txt, aviso){
    const el=document.getElementById('save-bar-txt'); if(!el) return;
    el.textContent = txt; el.style.color = aviso ? 'var(--rust)' : 'var(--ink-mute)'; el.style.fontWeight = aviso ? '700' : '400';
  }
  function guardar(){
    try{
      const s = ser(); if(s===ultimo) return;
      localStorage.setItem(KEY, s); ultimo = s;
      barra(`💾 Guardado neste aparelho às ${hh()} · ${STATE.blocos.length} blocos · ${STATE.guias.length} guias`);
    }catch(e){ barra('⚠ NÃO foi possível guardar (espaço cheio ou bloqueado). Faz Backup já.', true); }
  }
  setInterval(guardar, 2000);
  window.addEventListener('beforeunload', guardar);
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) guardar(); });
  window.addEventListener('DOMContentLoaded', ()=>{
    const q = id=>document.getElementById(id);
    barra(STATE.blocos.length ? `💾 Dados recuperados deste aparelho · ${STATE.blocos.length} blocos` : '💾 Sem dados ainda neste aparelho');
    q('btn-backup').onclick = ()=>{
      guardar();
      const o = JSON.parse(ser()); try{ o.sala = JSON.parse(localStorage.getItem('bf_sala')||'[]'); }catch(e){ o.sala=[]; }
      const d=new Date(), p=n=>String(n).padStart(2,'0');
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));
      a.download=`blockflow_backup_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    };
    q('file-restaurar').onchange = async e=>{
      const f=e.target.files[0]; if(!f) return;
      try{
        const o = JSON.parse(await f.text());
        if(!Array.isArray(o.blocos) || !Array.isArray(o.processos)) throw new Error('formato');
        if(!confirm(`Restaurar backup com ${o.blocos.length} blocos e ${(o.guias||[]).length} guias? Substitui os dados actuais deste aparelho.`)) return;
        localStorage.setItem(KEY, JSON.stringify(o));
        if(o.sala) localStorage.setItem('bf_sala', JSON.stringify(o.sala));
        ultimo = null; window.removeEventListener('beforeunload', guardar); location.reload();
      }catch(err){ alert('Ficheiro de backup inválido.'); }
      e.target.value='';
    };
    q('btn-limpar').onclick = ()=>{
      if(!confirm('Apagar TODOS os dados deste aparelho? Faz backup antes. Não pode ser desfeito.')) return;
      if(prompt('Escreve APAGAR para confirmar:')!=='APAGAR') return;
      localStorage.removeItem(KEY); localStorage.removeItem('bf_sala'); window.removeEventListener('beforeunload', guardar); location.reload();
    };
  });
})();

function agoraISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function nowStr(){
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function parseDataPT(str){
  if(!str) return null;
  const partes = str.split('/');
  if(partes.length!==3) return null;
  const [d,m,y] = partes.map(Number);
  if(!d||!m||!y) return null;
  return new Date(y, m-1, d);
}
function diasAteData(str){
  const alvo = parseDataPT(str);
  if(!alvo) return null;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  alvo.setHours(0,0,0,0);
  return Math.round((alvo.getTime() - hoje.getTime()) / 86400000);
}
function corCountdown(dias){
  if(dias===null) return '';
  if(dias<=1) return 'risk';
  if(dias<=5) return 'warn';
  return 'ok';
}
function txtCountdown(dias){
  if(dias===null) return '—';
  if(dias<0) return `atrasado ${Math.abs(dias)}d`;
  if(dias===0) return 'hoje';
  if(dias===1) return 'amanhã';
  return `${dias} dias`;
}
function clienteDeBloco(b){
  if(!b || !b.processo) return null;
  const p = STATE.processos.find(x=>x.codigo===b.processo);
  return p ? p.cliente : null;
}
function missaoPorId(id){ return STATE.missoes.find(m=>m.id===id) || null; }
function pesoDeBloco(b){ return b && b.pesoKg ? b.pesoKg : 0; }
function somaPeso(blocos){ return blocos.reduce((s,b)=> s + pesoDeBloco(b), 0); }

function formatarTon(pesoKg){
  if(!pesoKg) return '—';
  if(pesoKg < 1000) return pesoKg + ' kg';
  return (pesoKg/1000).toFixed(1).replace('.', ',') + ' t';
}
function formatarTonTotal(pesoKg){
  if(!pesoKg) return '0,0 t';
  const tons = pesoKg/1000;
  const partes = tons.toFixed(1).split('.');
  partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return partes.join(',') + ' t';
}
function cbmDeMedidas(c,a,l){ return +(c*a*l).toFixed(2); }

/* Dias com movimentos registados — para navegação rápida nos relatórios. */
function diasComDados(){
  return [...new Set(STATE.guias.map(g=>g.data).filter(Boolean))].sort().reverse();
}
function relDataLonga(iso){
  if(!iso) return '—';
  const [a,m,d] = iso.split('-');
  return `${d}/${m}/${a}`;
}

function detalheBlocosDaGuia(g){
  const wrap = document.createElement('div');
  g.blocos.forEach(num=>{
    const b = STATE.blocos.find(x=>x.numero===num);
    const p = document.createElement('p');
    p.style.cssText = 'font-size:11.5px;color:var(--ink-soft);margin:3px 0;font-family:var(--mono);';
    let linha = `· Bloco ${num}`;
    if(b){
      linha += b.processo ? ` · ${b.processo}` : ' · ⚠ sem processo';
      const c = clienteDeBloco(b);
      if(c) linha += ` · ${c}`;
      if(b.pesoKg) linha += ` · ${formatarTon(b.pesoKg)}`;
      if(b.estado==='anulado') linha += ' · ⊘ anulado';
      if(g.poroes && g.poroes[num]) linha += ` · porão ${g.poroes[num]}`;
    } else {
      linha += ' · (não encontrado)';
    }
    p.textContent = linha;
    wrap.appendChild(p);
  });
  return wrap;
}

function tornarExpansivel(row, g){
  row.classList.add('expandivel');
  const box = document.createElement('div');
  const detail = document.createElement('div');
  detail.style.cssText = 'display:none;margin:-2px 0 8px 12px;padding:4px 0 0 8px;border-left:2px solid var(--slate);';
  let aberto = false, preenchido = false;
  row.onclick = ()=>{
    aberto = !aberto;
    const seta = row.querySelector('.seta-exp');
    if(seta) seta.textContent = aberto ? '▾' : '▸';
    detail.style.display = aberto ? 'block' : 'none';
    if(aberto && !preenchido){
      preenchido = true;
      detail.appendChild(detalheBlocosDaGuia(g));
    }
  };
  box.appendChild(row);
  box.appendChild(detail);
  return box;
}

function gerarQrAssinaturaSvg(){
  try{
    const qr = qrcode(0, 'M');
    qr.addData(linkAssinatura());
    qr.make();
    let svg = qr.createSvgTag({ cellSize: 4, margin: 4, scalable: true });
    svg = svg.replace('fill="black"', 'fill="#8F8878"');
    return svg;
  }catch(e){ return ''; }
}

/* Redundância: garante que o rodapé de assinatura existe na janela do
   relatório mesmo que o template em abrirRelatorio() tenha sido alterado. */
function garantirAssinatura(w){
  try{
    const doc = w.document;
    if(!doc.querySelector('.legal .eby')){
      const alvo = doc.querySelector('.page') || doc.body;
      if(!alvo) return;
      const div = doc.createElement('div');
      div.innerHTML = blocoAssinaturaHtml();
      alvo.appendChild(div.firstChild);
    }
  }catch(e){}
}

      <th>Blocos</th><th>Viag.</th>
    </tr></thead><tbody>`;
  motoristas.forEach(m => {
    let mB = 0, mV = 0;
    corpo += `<tr><td>${m}</td>`;
    rotas.forEach(r => {
      const c = (M[m] && M[m][r]) || { blocos:0, viagens:0 };
      mB += c.blocos; mV += c.viagens;
      totaisRota[r].blocos += c.blocos; totaisRota[r].viagens += c.viagens;
      corpo += `<td class="n">${c.blocos || 0}</td><td class="n">${c.viagens || 0}</td>`;
    });
    totalBlocos += mB; totalViagens += mV;
    corpo += `<td class="n"><strong>${mB}</strong></td><td class="n"><strong>${mV}</strong></td></tr>`;
  });
  corpo += `<tr class="tot"><td>TOTAL</td>`;
  rotas.forEach(r => { corpo += `<td class="n">${totaisRota[r].blocos}</td><td class="n">${totaisRota[r].viagens}</td>`; });
  corpo += `<td class="n">${totalBlocos}</td><td class="n">${totalViagens}</td></tr></tbody></table>`;

  let pesoTotalKg = 0;
  const pesoPorRota = {};
  rotas.forEach(r => pesoPorRota[r] = 0);
  guias.forEach(g => {
    const r = g.de + ' → ' + g.para;
    pesoPorRota[r] = (pesoPorRota[r] || 0) + (g.pesoKg || 0);
    pesoTotalKg += (g.pesoKg || 0);
  });
  corpo += `<h2>Tonelagem transportada</h2><table><thead><tr><th>Rota</th><th>Blocos</th><th>Toneladas</th></tr></thead><tbody>`;
  rotas.forEach(r => {
    corpo += `<tr><td>${r}</td><td class="n">${totaisRota[r].blocos}</td><td class="n">${formatarTonTotal(pesoPorRota[r])}</td></tr>`;
  });
  corpo += `<tr class="tot"><td>TOTAL</td><td class="n">${totalBlocos}</td><td class="n">${formatarTonTotal(pesoTotalKg)}</td></tr></tbody></table>`;
  return { corpo, landscape:true };
}

/* ---------- Carregamento de Navio ---------- */
function relCarregamento(missaoId){
  const guias = STATE.guias.filter(g => g.tipo==='embarque' && (!missaoId || g.missaoId===missaoId));
  if(guias.length===0){
    return { corpo: `<p style="font-size:11pt;color:#736E5E;">Ainda sem blocos embarcados${missaoId?(' para '+missaoId):''}.</p>`, landscape:false };
  }
  const missao = missaoId ? missaoPorId(missaoId) : null;
  const porPorao = {};
  let total = 0, totalKg = 0;
  guias.forEach(g => {
    g.blocos.forEach(num => {
      const b = STATE.blocos.find(x=>x.numero===num);
      const por = (g.poroes && g.poroes[num]) || (b && b.porao) || '—';
      if(!porPorao[por]) porPorao[por] = [];
      porPorao[por].push(num);
      total += 1;
      if(b && b.pesoKg) totalKg += b.pesoKg;
    });
  });
  let corpo = `<h2>Carregamento${missao?(' · '+missao.navio+' ('+missao.id+')'):''}</h2>`;
  corpo += `<p style="font-size:10pt;margin:0 0 10px;">Total carregado: <strong>${total}</strong> bloco(s) · <strong>${formatarTonTotal(totalKg)}</strong></p>`;
  Object.keys(porPorao).sort().forEach(por => {
    const blocos = porPorao[por];
    corpo += `<h2>Porão ${por} · ${blocos.length} bloco(s)</h2>`;
    corpo += `<table><thead><tr><th style="width:22%;">Nº Bloco</th><th style="width:22%;">Nº Bloco</th><th style="width:22%;">Nº Bloco</th><th style="width:22%;">Nº Bloco</th></tr></thead><tbody>`;
    for(let i=0; i<blocos.length; i+=4){
      corpo += `<tr>`;
      for(let c=0; c<4; c++){ corpo += `<td>${blocos[i+c] || ''}</td>`; }
      corpo += `</tr>`;
    }
    corpo += `</tbody></table>`;
  });
  return { corpo, landscape:false };
}

/* ---------- Mapa de Entrada Chibia ---------- */
function relMapaChibia(data){
  const guias = STATE.guias.filter(g => g.tipo==='entrada' && g.para==='Chibia' && g.data===data);
  if(guias.length===0){
    return { corpo: `<p style="font-size:11pt;color:#736E5E;">Sem entradas em Chibia registadas em ${relDataLonga(data)}.</p>`, landscape:false };
  }
  const linhas = [];
  guias.forEach(g => {
    g.blocos.forEach(num => {
      const b = STATE.blocos.find(x=>x.numero===num);
      linhas.push({
        motorista: g.motorista || '—',
        matricula: g.viatura || '—',
        bloco: num,
        guia: g.numero,
        cliente: b ? (clienteDeBloco(b)||'—') : '—',
        pesoKg: b ? (b.pesoKg||0) : 0,
      });
    });
  });
  const totalKg = linhas.reduce((s,l)=> s+l.pesoKg, 0);
  let corpo = `<h2>Entradas em Chibia · ${relDataLonga(data)} · ${linhas.length} bloco(s)</h2>`;
  corpo += `<table><thead><tr>
    <th style="width:40px;">Nº</th>
    <th>Motorista</th>
    <th style="width:90px;">Matrícula</th>
    <th style="width:80px;">Nº Bloco</th>
    <th style="width:80px;">Nº Guia</th>
    <th style="width:70px;">Cliente</th>
    <th style="width:80px;">Peso</th>
  </tr></thead><tbody>`;
  linhas.forEach((l,i)=>{
    corpo += `<tr><td class="n">${i+1}</td><td>${escH(l.motorista)}</td><td style="font-family:monospace;">${escH(l.matricula)}</td><td style="font-family:monospace;">${l.bloco}</td><td class="n">${l.guia||'—'}</td><td>${l.cliente}</td><td class="n">${l.pesoKg?formatarTon(l.pesoKg):'—'}</td></tr>`;
  });
  corpo += `<tr class="tot"><td colspan="6">TOTAL</td><td class="n">${formatarTonTotal(totalKg)}</td></tr></tbody></table>`;
  return { corpo, landscape:false };
}

/* ---------- Daily Report ---------- */
function relDailyReport(missaoId){
  const guias = STATE.guias.filter(g => g.tipo==='embarque' && (!missaoId || g.missaoId===missaoId));
  if(guias.length===0){
    return { corpo: `<p style="font-size:11pt;color:#736E5E;">Ainda sem embarques${missaoId?(' para '+missaoId):''}.</p>`, landscape:true };
  }
  const porDia = {};
  guias.forEach(g => {
    const dia = g.data || '—';
    if(!porDia[dia]) porDia[dia] = { porao: {}, total:{qty:0, tons:0} };
    g.blocos.forEach(num => {
      const b = STATE.blocos.find(x=>x.numero===num);
      const por = (g.poroes && g.poroes[num]) || (b && b.porao) || '—';
      const tons = b && b.pesoKg ? b.pesoKg/1000 : 0;
      if(!porDia[dia].porao[por]) porDia[dia].porao[por] = { qty:0, tons:0 };
      porDia[dia].porao[por].qty += 1;
      porDia[dia].porao[por].tons += tons;
      porDia[dia].total.qty += 1;
      porDia[dia].total.tons += tons;
    });
  });
  const dias = Object.keys(porDia).sort();
  const poroes = [...new Set(dias.flatMap(d => Object.keys(porDia[d].porao)))].sort();
  let corpo = `<h2>Daily Report · Carregamento por porão</h2>`;
  corpo += `<p style="font-size:9pt;color:#736E5E;margin:0 0 10px;">Estrutura alinhada com o Daily Report do armador. Campos FM/TO e Lecturer a preencher manualmente — o sistema fornece Qty e Tons por porão.</p>`;
  corpo += `<table><thead><tr>
    <th>Data</th><th style="width:70px;">FM</th><th style="width:70px;">TO</th><th>Lecturer</th>
    ${poroes.map(p=>`<th colspan="2" style="text-align:center;">Porão ${p}</th>`).join('')}
    <th colspan="2" style="text-align:center;background:#F3E1BC;">Cargo</th>
    <th style="width:60px;">Turno</th>
  </tr>
  <tr class="sub"><th></th><th></th><th></th><th></th>
    ${poroes.map(()=>'<th>Qty</th><th>Tons</th>').join('')}
    <th>Qty</th><th>Tons</th><th></th>
  </tr></thead><tbody>`;
  let totQty = 0, totTon = 0;
  const totPor = {};
  poroes.forEach(p => totPor[p] = { qty:0, tons:0 });
  dias.forEach(dia => {
    const info = porDia[dia];
    corpo += `<tr><td>${relDataLonga(dia)}</td><td></td><td></td><td></td>`;
    poroes.forEach(p=>{
      const c = info.porao[p] || { qty:0, tons:0 };
      totPor[p].qty += c.qty; totPor[p].tons += c.tons;
      corpo += `<td class="n">${c.qty||0}</td><td class="n">${c.tons?c.tons.toFixed(2).replace('.',','):'0,00'}</td>`;
    });
    corpo += `<td class="n">${info.total.qty}</td><td class="n">${info.total.tons.toFixed(2).replace('.',',')}</td><td></td></tr>`;
    totQty += info.total.qty; totTon += info.total.tons;
  });
  corpo += `<tr class="tot"><td colspan="4">TOTAL / TRANSPORT</td>
    ${poroes.map(p=>`<td class="n">${totPor[p].qty}</td><td class="n">${totPor[p].tons.toFixed(2).replace('.',',')}</td>`).join('')}
    <td class="n">${totQty}</td><td class="n">${totTon.toFixed(2).replace('.',',')}</td><td></td></tr></tbody></table>`;
  corpo += `<h2>Notas do turno</h2>
    <p style="font-size:9pt;color:#736E5E;margin:0 0 12px;">Este documento é produzido no terminal pelos lecturers. O sistema gera a parte quantitativa; horas e observações seguem manuscritas até integração.</p>
    <div style="border:1px solid #C7C1B2;border-radius:6px;height:80px;"></div>`;
  return { corpo, landscape:true };
}

  function showToast(msg, kind){

    bloco.historico.push({ campo, de: valorAnterior, para: valorNovo, por: 'Produção', quando: agoraISO()+' '+nowStr() });

        <p style="font-size:11.5px;color:var(--ink-mute);margin:0 0 8px;">Cliente (herdado): <strong style="color:var(--ink-soft);">${clienteActual || '—'}</strong></p>
        <div style="display:flex;gap:6px;margin-bottom:10px;" id="edit-tipo-carga"></div>
        ${servidorLog() ? `<input id="edit-motivo" placeholder="Motivo da correção (obrigatório)" style="width:100%;height:36px;border-radius:8px;border:1px solid var(--border-strong);padding:0 10px;font-size:13px;margin-bottom:8px;background:var(--surface);color:var(--ink);" />` : ''}
        <div style="display:flex;gap:6px;">

      const ewarn = editArea.querySelector('#edit-warn');
      ewarn.style.display = 'none';
      if(servidorLog()){
        const motivo = (editArea.querySelector('#edit-motivo').value||'').trim();
        const p = { numero:b.numero, motivo };
        if(m && (m.compM!==b.compM || m.altM!==b.altM || m.largM!==b.largM)){ p.comp = m.compM; p.alt = m.altM; p.larg = m.largM; }
        if(novoProc !== b.processo) p.processo = novoProc || '';
        if(tipoCargaEdit !== (b.tipoCarga||'granel')) p.tipo_carga = tipoCargaEdit;
        if(Object.keys(p).length <= 2){ ewarn.textContent = 'Nada foi alterado.'; ewarn.style.display='block'; return; }
        if(!motivo){ ewarn.textContent = 'Indica o motivo da correção.'; ewarn.style.display='block'; return; }
        const r = await corrigirNoServidor(p);
        if(r.erro){ ewarn.textContent = r.erro; ewarn.style.display='block'; return; }
        if(window.bfSincronizar) await window.bfSincronizar(false);
        if(window.celebrar) window.celebrar('Correção gravada', `Bloco ${b.numero}`); return;
      }
      if(!novoNum){ ewarn.textContent = 'O número não pode ficar vazio.'; ewarn.style.display='block'; return; }
      if(novoNum !== b.numero && STATE.blocos.some(x=>x.numero===novoNum)){ ewarn.textContent = `Já existe um bloco ${novoNum}.`; ewarn.style.display='block'; return; }
      let mudou = false;
      if(novoNum !== b.numero){ registarAlteracao(b,'número',b.numero,novoNum); b.numero = novoNum; mudou = true; }
      if(m && (m.compM!==b.compM || m.altM!==b.altM || m.largM!==b.largM)){
        registarAlteracao(b, 'medidas', `${b.compM||'—'}×${b.altM||'—'}×${b.largM||'—'}`, `${m.compM}×${m.altM}×${m.largM}`);
        registarAlteracao(b, 'peso', b.pesoKg, m.pesoKg);
        b.compM = m.compM; b.altM = m.altM; b.largM = m.largM;
        b.cbm = m.cbm; b.pesoKg = m.pesoKg;
        mudou = true;
      }
      if(novoProc !== b.processo){
        registarAlteracao(b,'processo', b.processo, novoProc);
        b.processo = novoProc;
        const proc = novoProc && STATE.processos.find(p=>p.codigo===novoProc);
        if(proc && proc.porConfirmar) proc.porConfirmar = false;
        mudou = true;
      }
      if(tipoCargaEdit !== (b.tipoCarga||'granel')){ registarAlteracao(b,'tipo de carga', b.tipoCarga||'granel', tipoCargaEdit); b.tipoCarga = tipoCargaEdit; mudou = true; }
      if(!mudou){ showToast('Nada foi alterado.', 'err'); return; }
      showToast(`Bloco ${b.numero} corrigido.`, 'ok');
      edicaoNum = b.numero; renderEdicao(); renderRecent();

  buscaEdit.addEventListener('input', ()=>{

  phone.querySelector('#btn-registar').onclick = async ()=>{
    const num = inputNum.value.trim();
    warn.style.display = 'none';
    if(!num){ warn.textContent = 'Indica o número do bloco.'; warn.style.display='block'; return; }
    if(STATE.blocos.some(x=>x.numero===num)){ warn.textContent = `O bloco ${num} já existe no sistema.`; warn.style.display = 'block'; return; }
    if(!processoSel){ warn.textContent = 'Escolhe o processo, ou marca "Sem processo" (o bloco pode ir até à Chibia sem processo).'; warn.style.display = 'block'; return; }
    const m = lerMedidas();
    if(!m){ warn.textContent = 'Preenche as medidas (Comp × Alt × Larg) para o peso ser calculado e gravado.'; warn.style.display = 'block'; return; }
    /* --- Ligado ao Supabase: grava no servidor (registar_bloco) e só confirma se o servidor aceitar --- */
    if(window.sb && window.BF_USER && ['admin','producao'].includes(window.BF_USER.papel)){
      const btnR = phone.querySelector('#btn-registar'); btnR.disabled = true;
      try{
        const {data,error} = await window.sb.rpc('registar_bloco', { p:{ numero:num, processo:processoSel.codigo, cliente:processoSel.cliente||null,
          comp:m.compM, alt:m.altM, larg:m.largM, origem:pedreiraSel(), tipo_carga:tipoCargaSel } });
        if(error) throw error;
        if(data && data.erro){ warn.textContent = data.erro; warn.style.display='block'; btnR.disabled=false; return; }
      }catch(e){
        warn.textContent = 'Não gravou no servidor: '+(e.message||e); warn.style.display='block'; btnR.disabled=false; return;
      }
      btnR.disabled = false;
      window.celebrar('Bloco registado', num + (processoSel.codigo ? ' · '+processoSel.codigo : ''));
      inputNum.value=''; inputComp.value=''; inputAlt.value=''; inputLarg.value='';
      tipoCargaSel = 'granel'; renderTipoCarga(); actualizarPreview();
      processoSel = null; criandoProcesso = false; renderProcessoArea();
      if(window.bfSincronizar) await window.bfSincronizar(false);
      inputNum.focus(); renderRecent();
      return;
    }
    const novo = {
      numero: num, processo: processoSel.codigo,
      origem: pedreiraSel(), local: pedreiraSel(), estado: 'no_mingue',
      tipoCarga: tipoCargaSel,
      compM: m.compM, altM: m.altM, largM: m.largM, cbm: m.cbm, pesoKg: m.pesoKg,
      registadoHoje: true, registadoPor: 'Produção', historico: [],
    };
    registarAlteracao(novo, 'criação', null, num);
    if(novo.processo) registarAlteracao(novo, 'processo', null, novo.processo);
    registarAlteracao(novo, 'medidas', null, `${m.compM}×${m.altM}×${m.largM}`);
    registarAlteracao(novo, 'peso', null, m.pesoKg);
    STATE.blocos.push(novo);
    showToast(`Bloco ${num} registado (${formatarTon(m.pesoKg)}${novo.processo?(' · '+novo.processo):' · sem processo'}).`, 'ok');
    inputNum.value=''; inputComp.value=''; inputAlt.value=''; inputLarg.value='';
    tipoCargaSel = 'granel'; renderTipoCarga(); actualizarPreview();
    processoSel = null; criandoProcesso = false; renderProcessoArea();
    inputNum.focus(); renderRecent();
  };

  renderRecent();
  renderEdicao();
  /* ---- CARGA INICIAL (Excel/CSV) — só para arranque a meio da operação ---- */
  (function cargaInicial(){
    const area = phone.querySelector('#carga-area');
    const ehProducao = ()=> !!(window.BF_USER && window.BF_USER.papel==='producao');
    const norm = s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
    const LOCAIS = ['Mingue',...ORIGENS_BAIXA_ATIVIDADE,...POSTOS];
    const ALIAS = { porto:'Sogester', terminal:'Sogester', sacomar:'Saco-Mar', estaleiro:'Chibia', estaleirocentral:'Chibia' };
    const normLocal = v=>{
      const n = norm(v); if(!n) return null;
      const ex = LOCAIS.find(l=>norm(l)===n); if(ex) return ex;
      const inc = LOCAIS.slice().sort((x,y)=>y.length-x.length).find(l=>n.includes(norm(l))); if(inc) return inc;
      const al = Object.keys(ALIAS).find(k=>n.includes(k)); return al ? ALIAS[al] : null;
    };
    const CAMPOS = [['numero','Nº do bloco',/bloco/i],['processo','Processo',/process/i],['cliente','Cliente',/cliente|descarga/i],
      ['local','Localização / pedreira',/localiza|parque|invent|pedreira|origem|^local$/i],['peso','Peso',/peso/i],['comp','Comp',/^comp/i],['alt','Alt',/^alt/i],['larg','Larg',/^larg/i],['cbm','CBM',/cbm|m3|m³/i]];
    let linhas=[], cab=[], map={}, locDef='Mingue';
    const num = v=>{ const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.')); return isFinite(n)?n:null; };

    area.innerHTML = `<p class="section-title" style="margin-top:16px;">${ehProducao()?'Importar produção (Excel)':'Carga inicial (Excel)'} <span style="font-weight:400;color:var(--ink-mute);">${ehProducao()?'— listas das pedreiras':'— só para arranque'}</span></p>
      <p style="font-size:11.5px;color:var(--ink-mute);margin:0 0 8px;">Importa blocos já existentes com o processo e a localização real de cada um. Fica marcado no histórico como «carga inicial».</p>
      <input id="carga-file" type="file" accept=".xlsx,.xls,.csv" style="font-size:12px;margin-bottom:8px;max-width:100%;" />
      <div id="carga-out"></div>`;
    const out = area.querySelector('#carga-out');
    const porCompletar = STATE.blocos.filter(b=>b.porCompletar && !b.pesoKg && b.estado!=='anulado');
    if(porCompletar.length){
      const pc = document.createElement('div'); pc.style.cssText='margin:0 0 10px;padding:10px;border:1px solid var(--amber);border-radius:10px;';
      pc.innerHTML = `<p style="margin:0 0 6px;font-size:12.5px;"><strong>${porCompletar.length}</strong> bloco(s) registado(s) na entrada, por completar (processo e medidas). Toca para abrir:</p><div style="display:flex;flex-wrap:wrap;gap:6px;">${porCompletar.slice(0,30).map(b=>`<button class="btn ghost small" type="button" data-n="${b.numero}">${b.numero}</button>`).join('')}</div>`;
      pc.querySelectorAll('button').forEach(bt=>bt.onclick=()=>{ edicaoNum = bt.dataset.n; renderEdicao(); try{ editArea.scrollIntoView({behavior:'smooth'}); }catch(e){} });
      area.parentNode.insertBefore(pc, area);
    }

    area.querySelector('#carga-file').onchange = async e=>{
      const f = e.target.files[0]; if(!f) return;
      if(typeof XLSX==='undefined'){ out.innerHTML='<p style="font-size:12px;color:var(--rust);">Biblioteca Excel não carregou (sem internet?). Tenta de novo com rede.</p>'; return; }
      const wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''});
      const hi = rows.slice(0,15).findIndex(r=>r.filter(c=>String(c).trim()!=='').length>=3 && r.some(c=>/bloco/i.test(String(c))));
      if(hi<0){ out.innerHTML='<p style="font-size:12px;color:var(--rust);">Não encontrei um cabeçalho com «Bloco» nas primeiras 15 linhas.</p>'; return; }
      if(ehProducao()) locDef = pedreiraSel();
      cab = rows[hi].map(c=>String(c).trim()); linhas = rows.slice(hi+1).filter(r=>r.some(c=>String(c).trim()!==''));
      map = {}; const usadas = new Set();
      CAMPOS.forEach(([k,,rx])=>{ const i = cab.findIndex((c,ix)=>!usadas.has(ix)&&rx.test(c)); if(i>=0){ map[k]=i; usadas.add(i); } });
      analisar();
    };

    function analisar(){
      const ja = new Set(STATE.blocos.map(b=>String(b.numero))), vistos = new Set();
      const ok=[], erros=[]; let semProc=0, semPeso=0, localDef=0;
      linhas.forEach((r,ix)=>{
        const g = k=> map[k]==null ? '' : r[map[k]];
        let n = String(g('numero')).trim().replace(/\.0+$/,'');
        if(!n){ erros.push(`Linha ${ix+1}: sem nº de bloco`); return; }
        if(vistos.has(n)){ erros.push(`Bloco ${n}: repetido no ficheiro`); return; }
        vistos.add(n);
        if(ja.has(n)){ erros.push(`Bloco ${n}: já existe no sistema`); return; }
        const rawLoc = String(g('local')).trim(); let local = normLocal(rawLoc);
        if(rawLoc && !local){ erros.push(`Bloco ${n}: localização «${rawLoc}» desconhecida`); return; }
        if(!local){ local = locDef; localDef++; }
        if(ehProducao() && !(local==='Mingue' || ORIGENS_BAIXA_ATIVIDADE.includes(local))){ erros.push(`Bloco ${n}: a produção só entra em pedreiras (${local})`); return; }
        const proc = String(g('processo')).trim().toUpperCase().replace(/\s+/g,'') || null; if(!proc) semProc++;
        let comp=num(g('comp')), alt=num(g('alt')), larg=num(g('larg')), cbm=num(g('cbm')), peso=num(g('peso'));
        if(!cbm && comp && alt && larg) cbm = cbmDeMedidas(comp,alt,larg);
        if(!peso && cbm) peso = Math.round(cbm*DENSIDADE_GRANITO*1000); else if(peso && peso<200) peso = Math.round(peso*1000);
        if(!peso) semPeso++;
        ok.push({ numero:n, processo:proc, cliente:String(g('cliente')).trim()||null, local, comp, alt, larg, cbm, peso });
      });
      const porLocal={}, porProc={}; ok.forEach(b=>{ porLocal[b.local]=(porLocal[b.local]||0)+1; const p=b.processo||'(sem processo)'; porProc[p]=(porProc[p]||0)+1; });
      const novosProc = Object.keys(porProc).filter(p=>p!=='(sem processo)' && !STATE.processos.some(x=>x.codigo===p));
      const sel = k=>`<select data-k="${k}" style="height:28px;font-size:11.5px;max-width:140px;"><option value="">— nenhuma —</option>${cab.map((c,i)=>`<option value="${i}" ${map[k]===i?'selected':''}>${c||('col '+(i+1))}</option>`).join('')}</select>`;
      out.innerHTML = `
        <p style="font-size:11.5px;color:var(--ink-mute);margin:0 0 4px;">Colunas do ficheiro (corrige se a detecção falhou):</p>

          <p style="margin:0 0 4px;color:var(--ink-soft);">Por localização: ${Object.entries(porLocal).map(([l,q])=>`${l} ${q}`).join(' · ')||'—'}</p>
          <p style="margin:0 0 4px;color:var(--ink-soft);">Processos: ${Object.keys(porProc).length}${novosProc.length?` (${novosProc.length} novos: ${novosProc.slice(0,6).join(', ')}${novosProc.length>6?'…':''})`:''}</p>

          ${semPeso?`<p style="margin:0 0 4px;color:var(--amber);">⚠ ${semPeso} sem peso/medidas</p>`:''}
          ${localDef?`<p style="margin:0 0 4px;color:var(--amber);">⚠ ${localDef} sem localização no ficheiro → ficam em ${locDef}</p>`:''}

      out.querySelector('#carga-go').onclick = async ()=>{
        if(!confirm(`Importar ${ok.length} blocos como ${ehProducao()?'produção':'carga inicial'}? Não é possível desfazer.`)) return;
        if(window.sb && window.BF_USER && ['admin','producao'].includes(window.BF_USER.papel)){
          const btn = out.querySelector('#carga-go'); btn.disabled = true;
          const nome = (area.querySelector('#carga-file').files[0]||{}).name || 'carga', T = 200, partes = Math.ceil(ok.length/T);
          let imp = 0, rec = [];
          try{
            for(let i=0;i<partes;i++){
              btn.textContent = `A enviar ${i+1}/${partes}…`;
              const lote = ok.slice(i*T,(i+1)*T).map(b=>({ numero:b.numero, processo:b.processo, cliente:b.cliente, local:b.local, peso_kg:b.peso?Math.round(b.peso):null, cbm:b.cbm, comp:b.comp, alt:b.alt, larg:b.larg }));

              if(error) throw error; if(data && data.erro) throw new Error(data.erro);
              imp += data.importados; rec = rec.concat(data.recusados||[]);
            }
          }catch(e){ showToast('Falhou o envio: '+(e.message||e)+' · já enviados: '+imp, 'err'); btn.disabled=false; btn.textContent='Importar'; return; }
          out.innerHTML=''; area.querySelector('#carga-file').value='';
          showToast(`${ehProducao()?'Produção enviada':'Carga enviada'} ao servidor: ${imp} blocos`+(rec.length?` · ${rec.length} recusados`:''), 'ok');
          if(window.bfSincronizar) await window.bfSincronizar(false);
          return;
        }
        ok.forEach(b=>{
          if(b.processo && !STATE.processos.some(p=>p.codigo===b.processo)){
            if(b.cliente && !STATE.clientes.some(c=>c.codigo===b.cliente)) STATE.clientes.push({ codigo:b.cliente, nome:b.cliente, criadoEm:agoraISO(), criadoPor:'Carga inicial' });
            STATE.processos.push({ codigo:b.processo, cliente:b.cliente, origem:'Mingue', meta:null, metaTon:null, criadoEm:agoraISO(), criadoPor:'Carga inicial', porConfirmar:true });
          }
          const naPedreira = b.local==='Mingue' || ORIGENS_BAIXA_ATIVIDADE.includes(b.local);
          const novo = { numero:b.numero, processo:b.processo, origem: naPedreira?b.local:'Mingue', local:b.local, estado: naPedreira?'no_mingue':'confirmado',
            tipoCarga:'granel', contentor:null, registadoHoje:false, registadoPor:'Carga inicial', historico:[] };
          if(b.peso){ novo.pesoKg=b.peso; if(b.cbm) novo.cbm=b.cbm; if(b.comp&&b.alt&&b.larg){ novo.compM=b.comp; novo.altM=b.alt; novo.largM=b.larg; } }
          registarAlteracao(novo,'criação',null,b.numero); registarAlteracao(novo,'origem do registo',null,'carga inicial · '+b.local);
          STATE.blocos.push(novo);
        });
        const n = ok.length; out.innerHTML=''; area.querySelector('#carga-file').value='';
        showToast(`Carga inicial concluída: ${n} blocos.`, 'ok'); render();
      };
    }
  })();

  return wrap;
}

const ROTAS = {
  'Mingue': ['Chibia'], 'Mingue 2': ['Chibia'], 'Canhimei': ['Chibia'], 'Serra da Lua': ['Chibia'],
  'Pocólo': ['Chibia'], 'P. Ompapa': ['Chibia'], 'Lepi': ['Chibia'], 'Virei': ['Chibia'], 'Blue': ['Chibia'],
  'Chibia': ['Arimba','Caraculo','Saco-Mar','Sogester'],
  'Arimba': ['Caraculo','Saco-Mar','Sogester'],
  'Caraculo': ['Saco-Mar','Sogester'],
  'Saco-Mar': ['Sogester'],
  'Sogester': ['Saco-Mar'],
};
const POSTOS = ['Chibia','Arimba','Caraculo','Saco-Mar','Sogester'];
const ORIGENS_BAIXA_ATIVIDADE = ['Mingue 2','Canhimei','Serra da Lua','Pocólo','P. Ompapa','Lepi','Virei','Blue'];
const FERROVIA = ['Arimba','Caraculo','Saco-Mar'];
const CAPACIDADE = { camiao: 4, comboio: 20 };
function capacidadeDe(modal){ return CAPACIDADE[modal] || CAPACIDADE.camiao; }
function destinosDe(p){ return ROTAS[p] || []; }
function origensDe(p){ return Object.keys(ROTAS).filter(o=>ROTAS[o].includes(p)); }
function saidaTemComboio(p){ return FERROVIA.includes(p); }
function entradaTemComboio(origem){ return !!origem && FERROVIA.includes(origem); }

let confMode = 'entrada';
let postoAtivo = 'Chibia';
let formState = null;
function nextGuia(){ return STATE.ultimaGuia + 1; }

function pendentesParaEntrada(postoDestino, origem){
  if(!origem) return [];
  return STATE.blocos.filter(b=>{
    if(b.estado === 'anulado') return false;
    if(origem === 'Mingue' || ORIGENS_BAIXA_ATIVIDADE.includes(origem)) return b.local === origem && b.estado === 'no_mingue';
    return b.estado === 'a_caminho' && b.origemMovimento === origem;
  });
}
function viagensParaEntrada(postoDestino, origem){
  const pend = pendentesParaEntrada(postoDestino, origem);
  const map = new Map();
  pend.forEach(b=>{
    const chave = b.guiaMovimento ? String(b.guiaMovimento) : 'PRODUCAO';
    if(!map.has(chave)){
      map.set(chave, { chave, guia: b.guiaMovimento || null, hora: b.horaMovimento || null, data: b.dataMovimento || null,
        destinoDeclarado: b.destinoMovimento || null, desviada: !!b.destinoMovimento && b.destinoMovimento !== postoDestino,
        modal: b.modalMovimento || 'camiao', motorista: b.motoristaMovimento || null, viatura: b.viaturaMovimento || null,
        carruagem: b.carruagemMovimento || null, blocos: [] });
    }
    map.get(chave).blocos.push(b);
  });
  if(!map.has('PRODUCAO') && (origem==='Mingue' || ORIGENS_BAIXA_ATIVIDADE.includes(origem)))
    map.set('PRODUCAO', { chave:'PRODUCAO', guia:null, hora:null, data:null, destinoDeclarado:null, desviada:false, modal:'camiao', motorista:null, viatura:null, carruagem:null, blocos:[] });
  return Array.from(map.values()).sort((a,b)=>(a.guia||0)-(b.guia||0));
}
function viagemSelecionada(){
  if(confMode!=='entrada' || !formState.guiaSel) return null;
  return viagensParaEntrada(postoAtivo, formState.origem).find(v=>v.chave === formState.guiaSel) || null;
}
function resetForm(){
  const origens = origensDe(postoAtivo);
  formState = {
    modal: 'camiao', usandoUltimo: false, nome: null, matricula: null, guia: '',
    destino: null, origem: origens.length === 1 ? origens[0] : null, blocos: [''], poroes: [null],
    selecionados: [], guiaSel: null, trocaPessoa: false, filtroPendente: '', focoFiltro: false,
    carruagem: '', missaoId: null, tipoSaidaChibia: 'granel', processoContentor: '', numContentor: '', externo: false, empresaExterna: '',
    mostrarTodosPendentes: false, mostrarOutrasOrigens: false,
  };
}
resetForm();
function aplicarModal(modal){
  formState.modal = modal; formState.usandoUltimo = false; formState.nome = null; formState.matricula = null; formState.carruagem = ''; formState.externo = false; formState.empresaExterna = '';
  const cap = capacidadeDe(modal);
  if(formState.selecionados.length > cap) formState.selecionados = formState.selecionados.slice(0, cap);
  if(formState.blocos.length > cap) formState.blocos = formState.blocos.slice(0, cap);
  if(formState.poroes.length > cap) formState.poroes = formState.poroes.slice(0, cap);
}
function preencherUltimo(modal){
  formState.usandoUltimo = true;
  if(modal === 'comboio'){
    formState.nome = STATE.ultimoComboio.maquinista; formState.matricula = STATE.ultimoComboio.locomotiva; formState.carruagem = STATE.ultimoComboio.carruagem || '';
  } else {
    formState.nome = STATE.ultimo.nome; formState.matricula = STATE.ultimo.matricula; formState.carruagem = '';
  }
}
function adoptarViagem(v){
  formState.guiaSel = v.chave; formState.trocaPessoa = false;
  formState.selecionados = v.blocos.map(b=>b.numero);
  if(v.guia){
    formState.guia = String(v.guia); formState.modal = v.modal;
    formState.nome = v.motorista; formState.matricula = v.viatura; formState.carruagem = v.carruagem || '';
  } else {
    formState.guia = String(nextGuia()); formState.modal = 'camiao';
    formState.nome = null; formState.matricula = null; formState.carruagem = ''; formState.selecionados = [];
  }
}


let parqueAberto = false, parqueTodos = false, parqueVista = 'processo', parqueExp = null, buscaAberta = false, buscaQ = '';
function parqueResumo(posto){
  const idx = new Map(); STATE.blocos.forEach(b=>idx.set(b.numero,b));
  const hoje = agoraISO(); const porProc = {}, porCli = {};
  const L = k=> porProc[k] || (porProc[k] = { aqui:0, sairam:0, chegar:0 });
  const LC = k=> porCli[k] || (porCli[k] = { aqui:0, sairam:0, chegar:0 });
  const ck = b=> (b && clienteDeBloco(b)) || 'Sem cliente';
  let aqui = 0, chegar = 0;
  STATE.blocos.forEach(b=>{ const k = b.processo || 'Sem processo';
    if(parqueDe(b)===posto){ aqui++; L(k).aqui++; LC(ck(b)).aqui++; }
    else if(b.estado==='a_caminho' && b.destinoMovimento===posto){ chegar++; L(k).chegar++; LC(ck(b)).chegar++; } });
  const sairam = new Set(), hojeSet = new Set();
  (STATE.guias||[]).forEach(g=>{
    const sai = (g.tipo==='saida' && g.de===posto) || (g.tipo==='embarque' && posto==='Sogester' && /^Embarcado/.test(g.para||''));
    if(!sai) return;
    (g.blocos||[]).forEach(n=>{ sairam.add(n); if(g.data===hoje) hojeSet.add(n); });
  });
  sairam.forEach(n=>{ const b = idx.get(n); L(b && b.processo ? b.processo : 'Sem processo').sairam++; LC(ck(b)).sairam++; });
  return { aqui, chegar, sairam: sairam.size, hoje: hojeSet.size, porProc, porCli, sairamSet: sairam };
}

  box.innerHTML = `<div style="display:flex;gap:4px;">${num(r.aqui,'Aqui agora')}${num(r.chegar,'A chegar','#8A5E0B')}${num(r.hoje,'Saíram hoje','#2E7D4F')}${num(r.sairam,'Saíram (total)')}</div>
    <button type="button" class="btn ghost small" id="parque-tog" style="width:100%;margin-top:8px;">${parqueAberto?'Esconder detalhe':'Ver por processo / cliente'}</button><div id="parque-lista"></div>`;
  box.querySelector('#parque-tog').onclick = ()=>{ parqueAberto = !parqueAberto; render(); };
  if(parqueAberto){

    const seg = document.createElement('div'); seg.style.cssText = 'display:flex;gap:6px;margin-bottom:8px;';
    [['processo','Por processo'],['cliente','Por cliente']].forEach(([id,lbl])=>{
      const sb = document.createElement('button'); sb.type = 'button'; sb.className = 'btn small ' + (parqueVista===id?'primary':'ghost'); sb.style.flex = '1'; sb.textContent = lbl;
      sb.onclick = ()=>{ parqueVista = id; parqueExp = null; parqueTodos = false; render(); };
      seg.appendChild(sb);
    });
    lista.appendChild(seg);
    const fonte = parqueVista==='cliente' ? r.porCli : r.porProc;
    const chaveDe = b=> parqueVista==='cliente' ? ((clienteDeBloco(b)) || 'Sem cliente') : (b.processo || 'Sem processo');
    const linhas = Object.entries(fonte).filter(([,v])=>v.aqui||v.chegar||v.sairam).sort((a,b)=>(b[1].aqui+b[1].chegar)-(a[1].aqui+a[1].chegar));
    if(!linhas.length){ const vz = document.createElement('p'); vz.style.cssText = 'font-size:12.5px;color:var(--ink-mute);margin:0;'; vz.textContent = 'Sem blocos neste posto ainda.'; lista.appendChild(vz); }
    (parqueTodos ? linhas : linhas.slice(0,8)).forEach(([chave,v])=>{
      const tot = v.aqui + v.sairam, pct = tot ? Math.round(100*v.sairam/tot) : 0;
      const idExp = parqueVista+'|'+chave, aberto = parqueExp===idExp;
      const b = document.createElement('button'); b.type='button';
      b.style.cssText = 'display:block;width:100%;text-align:left;border:1px solid '+(aberto?'var(--slate)':'var(--border)')+';border-radius:8px;background:var(--surface-2);padding:7px 9px;margin-bottom:'+(aberto?'0':'6px')+';cursor:pointer;color:var(--ink);font:inherit;';
      b.innerHTML = `<div style="display:flex;justify-content:space-between;font-size:13px;"><strong></strong><span style="font-family:var(--mono);">${pct}% saído</span></div>
        <div style="font-size:12px;color:var(--ink-soft);margin:2px 0 4px;"><strong>${v.aqui}</strong> aqui (faltam sair) · <strong>${v.sairam}</strong> já saíram${v.chegar?` · <strong>${v.chegar}</strong> a chegar`:''}</div>
        <div style="height:5px;border-radius:3px;background:var(--border);overflow:hidden;"><div style="height:100%;width:${pct}%;background:#2E7D4F;"></div></div>`;
      b.querySelector('strong').textContent = chave;
      b.onclick = ()=>{ parqueExp = aberto ? null : idExp; render(); };
      lista.appendChild(b);
      if(aberto){

        const idx = new Map(STATE.blocos.map(x=>[x.numero,x]));
        const aqui = STATE.blocos.filter(x=> parqueDe(x)===postoAtivo && chaveDe(x)===chave).map(x=>x.numero);
        const chegar = STATE.blocos.filter(x=> parqueDe(x)!==postoAtivo && x.estado==='a_caminho' && x.destinoMovimento===postoAtivo && chaveDe(x)===chave).map(x=>x.numero);
        const sairam = [...r.sairamSet].filter(n=>{ const x = idx.get(n); return x ? chaveDe(x)===chave : chave==='Sem processo' || chave==='Sem cliente'; });
        const grupo = (titulo, arr, cor)=>{
          const g = document.createElement('div'); g.style.marginBottom = '8px';
          const t = document.createElement('div'); t.style.cssText = 'font-size:11px;font-weight:600;color:'+cor+';margin-bottom:4px;'; t.textContent = `${titulo} (${arr.length})`; g.appendChild(t);
          if(!arr.length){ const e = document.createElement('div'); e.style.cssText = 'font-size:12px;color:var(--ink-mute);'; e.textContent = 'nenhum'; g.appendChild(e); }
          const w = document.createElement('div'); w.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px;';
          arr.slice(0,40).forEach(n=>{ const c = document.createElement('span'); c.style.cssText = 'font-family:var(--mono);font-size:12px;border:1px solid var(--border-strong);border-radius:6px;padding:2px 6px;background:var(--surface-2);'; c.textContent = n; w.appendChild(c); });
          if(arr.length>40){ const m = document.createElement('span'); m.style.cssText = 'font-size:12px;color:var(--ink-mute);padding:2px 4px;'; m.textContent = `+${arr.length-40}`; w.appendChild(m); }
          g.appendChild(w); return g;
        };
        det.appendChild(grupo('Aqui, faltam sair', aqui, 'var(--ink)'));
        if(chegar.length) det.appendChild(grupo('A chegar', chegar, '#8A5E0B'));
        det.appendChild(grupo('Já saíram', sairam, '#2E7D4F'));
        if(parqueVista==='processo' && STATE.processos.some(x=>x.codigo===chave)){
          const sala = document.createElement('button'); sala.type='button'; sala.className='btn ghost small'; sala.textContent = 'Abrir sala deste processo';
          sala.onclick = ()=>{ salaProc = chave; abrirSala(); };
          det.appendChild(sala);
        }
        lista.appendChild(det);
      }
    });
    if(linhas.length>8){ const m = document.createElement('button'); m.type='button'; m.className='btn ghost small'; m.style.width='100%'; m.textContent = parqueTodos ? 'Ver menos' : `Ver todos (${linhas.length})`; m.onclick = ()=>{ parqueTodos = !parqueTodos; render(); }; lista.appendChild(m); }
  }
  return box;
}

/* Pesquisa de blocos no ecrã do conferente (lupa): por Nº de bloco ou Nº de guia */
function buscaBlocoPanel(){
  const box = document.createElement('div');
  box.style.cssText = 'border:2px solid var(--slate);border-radius:12px;background:var(--surface);padding:10px;margin-bottom:12px;';
  box.innerHTML = `<div style="display:flex;gap:8px;align-items:center;"><input id="busca-conf" inputmode="search" autocomplete="off" placeholder="Nº do bloco ou da guia" style="flex:1;height:44px;border-radius:10px;border:2px solid var(--slate);padding:0 12px;font-size:15px;background:var(--surface);color:var(--ink);" /><button type="button" class="btn ghost small" id="busca-fechar" style="height:44px;">Fechar</button></div><div id="busca-res" style="margin-top:8px;"></div>`;
  const inp = box.querySelector('#busca-conf'), res = box.querySelector('#busca-res');
  inp.value = buscaQ;
  const mk = (tag, css, txt)=>{ const e = document.createElement(tag); e.style.cssText = css; if(txt!==undefined) e.textContent = txt; return e; };
  const pintar = ()=>{
    res.innerHTML = '';
    const q = buscaQ.trim();
    if(!q){ res.appendChild(mk('p','font-size:12.5px;color:var(--ink-mute);margin:0;','Escreve o nº do bloco (ou parte dele) para ver onde está.')); return; }
    const guia = /^\d+$/.test(q) ? STATE.guias.find(g=>String(g.numero)===q) : null;
    if(guia){
      const h = mk('div','border:1px solid var(--border-strong);border-radius:8px;background:var(--surface-2);padding:7px 9px;margin-bottom:6px;font-size:12.5px;');
      h.appendChild(mk('div','font-weight:600;',`Guia ${q}${guia.motorista?' · '+guia.motorista:''}${guia.viatura?' · '+guia.viatura:''}`));
      h.appendChild(mk('div','color:var(--ink-soft);',`${guia.de} → ${guia.para} · ${guia.data} ${guia.hora} · ${(guia.blocos||[]).length} bloco(s)`));
      res.appendChild(h);
    }
    const daGuia = guia ? new Set(guia.blocos||[]) : new Set();
    const achados = STATE.blocos.filter(b=> b.numero.includes(q) || daGuia.has(b.numero));
    if(!achados.length){ res.appendChild(mk('p','font-size:12.5px;color:var(--ink-mute);margin:0;','Nenhum bloco encontrado.')); return; }
    achados.slice(0,8).forEach(b=>{
      const aqui = parqueDe(b)===postoAtivo, cli = clienteDeBloco(b);
      const card = mk('div','border:1px solid '+(aqui?'var(--moss)':'var(--border)')+';background:'+(aqui?'var(--moss-bg)':'var(--surface-2)')+';border-radius:8px;padding:8px 10px;margin-bottom:6px;');
      const top = mk('div','display:flex;justify-content:space-between;gap:8px;align-items:baseline;');
      top.appendChild(mk('strong','font-family:var(--mono);font-size:15px;','Bloco '+b.numero));
      if(aqui) top.appendChild(mk('span','font-size:11px;font-weight:600;color:var(--moss);','ESTÁ AQUI'));
      card.appendChild(top);

        if(hist.length>3) hw.appendChild(mk('div','font-size:11px;color:var(--ink-mute);',`+ ${hist.length-3} movimentação(ões) mais antiga(s)`));
        card.appendChild(hw);
      } else card.appendChild(mk('div','font-size:11.5px;color:var(--ink-mute);margin-top:4px;','Sem movimentações registadas.'));
      res.appendChild(card);
    });
    if(achados.length>8) res.appendChild(mk('p','font-size:12px;color:var(--ink-mute);margin:2px 0 0;',`+ ${achados.length-8} resultados — escreve mais dígitos para afinar.`));
  };
  inp.addEventListener('input', ()=>{ buscaQ = inp.value; pintar(); });
  box.querySelector('#busca-fechar').onclick = ()=>{ buscaAberta = false; render(); };

}

      ` : ''}
      ${enchimentoAqui ? `
        <p class="section-title" data-passo="tipoSaida">Tipo de saída</p>

        ${formState.tipoSaidaChibia==='contentor' ? `
          <p class="section-title" data-passo="contentor">Contentor <span style="font-weight:400;color:var(--ink-mute);">(enchido aqui, na Chibia)</span></p>

          <input id="input-contentor-chibia" value="${formState.numContentor||''}" placeholder="Nº do contentor (ex: FTAU136590-8)" style="width:100%;height:38px;border-radius:8px;border:1px solid var(--border-strong);padding:0 10px;font-size:13px;font-family:var(--mono);margin-bottom:4px;background:var(--surface);color:var(--ink);" />
          <p style="font-size:11px;color:var(--ink-mute);margin:0 0 14px;">O processo do bloco não muda — isto regista só a carga do contentor.</p>
        ` : ''}
      ` : ''}
      ${embarque ? (embarqueComNavio ? `<p class="section-title" data-passo="missao">Missão / Navio</p><div id="missoes-lista" style="margin-bottom:14px;"></div>` : '') : (guiaEditavel ? `
        <p class="section-title" data-passo="guia">Guia Nº <span style="font-weight:400;color:var(--ink-mute);">${guiaProducao ? '(emitida aqui)' : '(escreve o número do papel)'}</span></p>
        <input id="input-guia" value="${formState.guia}" placeholder="${guiaProducao ? '' : 'Nº da guia'}" style="width:100%;height:38px;border-radius:8px;border:1px solid ${guiaDuplicada?'var(--rust)':(guiaForaSeq?'var(--amber)':'var(--border-strong)')};padding:0 10px;font-size:13px;font-family:var(--mono);margin-bottom:4px;background:var(--surface);color:var(--ink);" />
        <p id="guia-warn" style="font-size:11.5px;margin:0 0 12px;display:${(guiaDuplicada||guiaForaSeq)?'block':'none'};color:${guiaDuplicada?'var(--rust)':'var(--amber)'};">${guiaDuplicada ? '⚠ Esta guia já foi registada.' : (guiaForaSeq ? `⚠ Fora da sequência esperada (${guiaEsperada}).` : '')}</p>
      ` : `
        <p class="section-title">Guia Nº</p>
        <div style="display:flex;align-items:center;gap:8px;border:1px solid var(--border-strong);border-radius:8px;padding:10px;margin-bottom:14px;background:var(--surface-2);">
          <span style="font-family:var(--mono);font-size:15px;font-weight:600;">${formState.guia}</span>
          <span style="font-size:11.5px;color:var(--ink-mute);">emitida em ${formState.origem} — aqui só se confirma</span>
        </div>
      `)}
      ${entrada ? `<p class="section-title" data-passo="selecionados">Blocos desta guia <span style="font-weight:400;color:var(--ink-mute);">(desmarca o que não chegou)</span></p><div id="pendentes-lista"></div>` : (noPorto ? '' : `
        <p class="section-title" data-passo="blocos">Bloco(s) <span style="font-weight:400;color:var(--ink-mute);">(até ${cap} por ${ehComboio?'comboio':'camião'})</span></p>
        <div id="blocos-inputs"></div>
        ${formState.blocos.length < cap ? `<button id="btn-add-bloco" class="btn ghost small" style="margin-bottom:14px;">+ adicionar bloco</button>` : '<div style="margin-bottom:14px;"></div>'}
      `)}
      ${pesoNoForm>0 ? `<p style="font-size:12px;color:var(--slate);font-family:var(--mono);font-weight:600;margin:0 0 10px;">Total: ${numerosNoForm.length} bloco(s) · ${formatarTonTotal(pesoNoForm)}</p>` : ''}
      <button id="btn-confirmar" class="btn ${entrada?'success':'primary'}" style="width:100%;height:46px;font-size:14px;">Confirmar ${entrada?'entrada':'saída'}</button>
      ` : ''}
    `;
    if(entrada){
      const origWrap = area.querySelector('#origens');
      if(origens.length===0) origWrap.innerHTML = '<p style="font-size:12.5px;color:var(--ink-mute);margin:0;">Este posto não recebe blocos.</p>';
      const criarBotaoOrigem = (o)=>{
        const b = document.createElement('button');
        b.className = 'btn small ' + (formState.origem===o ? 'primary' : 'ghost');
        b.textContent = o;
        b.onclick = ()=>{ formState.origem = o; formState.guiaSel = null; formState.selecionados = []; formState.trocaPessoa = false; formState.filtroPendente = ''; formState.focoFiltro = false; formState.mostrarTodosPendentes = false; renderForm(); };
        return b;
      };
      const principais = origens.filter(o=>!ORIGENS_BAIXA_ATIVIDADE.includes(o));
