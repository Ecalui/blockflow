const BF_URL = 'https://gysiloxejobisliutwui.supabase.co';   // Project URL  (Project Settings → API)  ex.: https://xxxx.supabase.co
const BF_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2lsb3hlam9iaXNsaXV0d3VpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NTY4MTYsImV4cCI6MjEwNjMzMjgxNn0.JdhFAKMyRo3OyEdmK6ygIuH37KS9BA4Qw-pFBSSmC98';   // chave anon / publishable  (NUNCA a service_role / secret)
(function auth(){
  const $ = id=>document.getElementById(id), ov=$('login-overlay'), CK='bf_perfil_v1';
  if(!BF_URL || !BF_KEY){ ov.remove(); return; }            // sem configuração: modo local, como antes
  const ROLE_MAP = {producao:'producao',conferente:'conferente',transportes:'transportes',direcao:'diretor',logistica:'logistica'};
  const NOMES = {producao:'Produção',conferente:'Conferente',transportes:'Transportes',direcao:'Direção',logistica:'Logística',admin:'Administrador'};
  const sb = (typeof supabase!=='undefined') ? supabase.createClient(BF_URL, BF_KEY, {auth:{persistSession:true,autoRefreshToken:true}}) : null;
  window.sb = sb;
  const cache = ()=>{ try{ return JSON.parse(localStorage.getItem(CK)||'null'); }catch(e){ return null; } };
  const sub = t=>{ $('login-sub').textContent = t; };
  const msg = t=>{ $('login-msg').textContent = t||''; };
  const mostrarForm = ()=>{ sub('Entra com a tua conta HMGranitos.'); $('login-form').style.display='block'; };

  async function carregarPerfil(uid){
    let r = await sb.from('perfis').select('nome,papel,posto,postos,activo').eq('user_id',uid).maybeSingle();
    if(r.error) r = await sb.from('perfis').select('nome,papel,posto,activo').eq('user_id',uid).maybeSingle();   // coluna «postos» ainda não criada
    if(r.error) throw r.error;
    return r.data ? {...r.data, user_id:uid} : null;
  }
  function entrar(p, offline){
    try{ localStorage.setItem(CK, JSON.stringify(p)); }catch(e){}
    window.BF_USER = p;
    if(p.papel!=='admin'){ role = ROLE_MAP[p.papel] || 'conferente'; document.body.classList.add('kiosk'); }
    if(p.papel==='conferente'){ let ult=null; try{ ult = localStorage.getItem('bf_posto_'+p.user_id); }catch(e){}
      const perm = [p.posto].concat(p.postos||[]).filter(Boolean);
      postoAtivo = (ult && perm.includes(ult)) ? ult : (p.posto || perm[0] || 'Chibia'); }
    if(p.papel!=='admin'){ ['btn-backup','btn-limpar'].forEach(i=>{ const e=$(i); if(e) e.style.display='none'; }); const fr=$('file-restaurar'); if(fr && fr.parentElement) fr.parentElement.style.display='none'; const fn=document.querySelector('.foot-note'); if(fn) fn.style.display='none'; }
    const bar = $('save-bar');
    if(bar && !$('user-chip')){
      const chip = document.createElement('span'); chip.id='user-chip'; chip.style.cssText='flex-basis:100%;font-size:11.5px;';
      chip.textContent = '👤 '+p.nome+' · '+(NOMES[p.papel]||p.papel)+(p.posto?' · '+p.posto:'')+(offline?' · sem rede':'');
      const sair = document.createElement('button'); sair.className='btn ghost small'; sair.type='button'; sair.textContent='Sair';
      sair.onclick = async ()=>{ if(!confirm('Terminar sessão neste aparelho?')) return; try{ await sb.auth.signOut(); }catch(e){} localStorage.removeItem(CK); location.reload(); };
      chip.appendChild(document.createTextNode(' ')); chip.appendChild(sair);
      const syn = document.createElement('button'); syn.className='btn ghost small'; syn.type='button'; syn.textContent='Atualizar'; syn.onclick=()=>window.bfSincronizar && window.bfSincronizar(true);
      chip.appendChild(document.createTextNode(' ')); chip.appendChild(syn); bar.prepend(chip);
    }
    ov.remove(); resetFormSeguro(); render();
    setTimeout(()=>{ if(window.bfSincronizar && !offline && navigator.onLine!==false) window.bfSincronizar('auto'); }, 400);
  }
  function resetFormSeguro(){ try{ if(typeof resetForm==='function') resetForm(); }catch(e){} }
  function semAcesso(t){ $('login-form').style.display='none'; sub(t); $('login-sair').style.display='block';
    $('login-sair').onclick = async ()=>{ try{ await sb.auth.signOut(); }catch(e){} localStorage.removeItem(CK); location.reload(); }; }

  async function arranque(){
    const c = cache();
    if(!sb){ if(c){ entrar(c,true); } else { sub('Sem ligação: o primeiro login precisa de rede.'); } return; }
    let sess=null;
    try{ sess = (await sb.auth.getSession()).data.session; }catch(e){}
    if(sess){
      try{ const p = await carregarPerfil(sess.user.id);
        if(!p || !p.activo){ semAcesso(p ? 'A tua conta está desactivada.' : 'A tua conta ainda não tem perfil. Fala com o administrador.'); return; }
        entrar(p,false); return;
      }catch(e){ if(c && c.user_id===sess.user.id){ entrar(c,true); return; } }
    } else if(c && navigator.onLine===false){ entrar(c,true); return; }
    mostrarForm();
  }
  $('login-form').addEventListener('submit', async ()=>{
    msg(''); const email=$('login-email').value.trim(), pass=$('login-pass').value;
    if(!email || !pass){ msg('Preenche o e-mail e a palavra-passe.'); return; }
    $('login-go').disabled = true; $('login-go').textContent='A entrar…';
    try{
      const {data,error} = await sb.auth.signInWithPassword({email, password:pass});
      if(error){ msg(/invalid|credentials/i.test(error.message) ? 'E-mail ou palavra-passe incorrectos.' : /fetch|network/i.test(error.message) ? 'Sem rede. O primeiro login precisa de ligação.' : error.message); return; }
      const p = await carregarPerfil(data.user.id);
      if(!p || !p.activo){ semAcesso(p ? 'A tua conta está desactivada.' : 'A tua conta ainda não tem perfil. Fala com o administrador.'); return; }
      entrar(p,false);
    }catch(e){ msg('Não foi possível entrar: '+(e.message||e)); }
    finally{ const g=$('login-go'); if(g){ g.disabled=false; g.textContent='Entrar'; } }
  });
  if(sb) sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT' && window.BF_USER){ localStorage.removeItem(CK); location.reload(); } });
  arranque();
})();
</script>

<script>
/* ---- PASSO 2A: espelho do servidor (leitura) ---- */
(function(){
  const aviso = t=>{ const el=document.getElementById('save-bar-txt'); if(el){ el.textContent=t; el.style.color='var(--ink-mute)'; } };
  const fmt = d=>{ if(!d) return null; const [y,m,dd]=String(d).slice(0,10).split('-'); return `${dd}/${m}/${y}`; };
  const hojeLuanda = ()=>new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Luanda'});
  async function ler(tabela, ordem){
    const PAG=1000; let tudo=[];
    for(let i=0;;i+=PAG){
      let q = window.sb.from(tabela).select('*'); String(ordem).split(',').forEach(o=>{ q = q.order(o); });
      const {data,error} = await q.range(i,i+PAG-1);
      if(error) throw error; tudo=tudo.concat(data); if(data.length<PAG) break;
    }
    return tudo;
  }
  function blocoDoServidor(r){
    const b = { numero:r.numero, processo:r.processo||null, origem:r.origem, tipoCarga:r.tipo_carga, contentor:r.contentor||null,
      pesoKg:r.peso_kg||undefined, cbm:r.cbm!=null?+r.cbm:undefined, compM:r.comp_m!=null?+r.comp_m:undefined, altM:r.alt_m!=null?+r.alt_m:undefined, largM:r.larg_m!=null?+r.larg_m:undefined,
      porao:r.porao||null, liberado: r.liberado ? {quando:r.liberado_em, lista:r.liberado_lista} : null,
      porCompletar: !!r.por_completar, registadoHoje: new Date(r.criado_em).toLocaleDateString('en-CA',{timeZone:'Africa/Luanda'})===hojeLuanda(), registadoPor:'Servidor', historico:[],
      origemMovimento:null, destinoMovimento:null, guiaMovimento:null, divergencia:false };
    switch(r.estado){
      case 'na_origem': b.estado='no_mingue'; b.local=r.local; break;
      case 'confirmado': b.estado='confirmado'; b.local=r.local; break;
      case 'a_caminho': b.estado='a_caminho'; b.local='A caminho de '+r.destino_mov; b.origemMovimento=r.origem_mov; b.destinoMovimento=r.destino_mov; b.guiaMovimento=r.guia_mov; break;
      case 'aguarda_navio': b.estado='aguarda_navio'; b.local='Sogester (aguarda navio)'; break;
      case 'entregue_sogester': b.estado='entregue_sogester'; b.local='Sogester (entregue)'; break;
      case 'aguarda_embarque_contentor': b.estado='aguarda_embarque_contentor'; b.local='Sogester (aguarda embarque contentor)'; break;
      case 'embarcado': b.estado='embarcado'; b.local='Embarcado · '+(r.navio||'?'); b.missaoId=r.processo; break;
      default: b.estado='anulado'; b.local='Mingue (anulado)';
    }
    return b;
  }
  let emSync = false;
  const aEscrever = ()=>{ const a=document.activeElement; if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
    try{ const f=formState; return !!(f && ((f.selecionados&&f.selecionados.length) || (f.blocos||[]).some(x=>x&&String(x).trim()) || f.nome || f.guia || f.destino)); }catch(e){ return false; } };
  /* modo: true = botão «Atualizar» · false = depois de gravar · 'auto' = em segundo plano (silencioso, não interrompe quem está a escrever) */
  window.bfSincronizar = async function(modo){
    const auto = (modo==='auto');
    if(!window.sb || !window.BF_USER || emSync) return false;
    if(window.bfFila && window.bfFila.pendentes()>0){
      await window.bfFila.flush(false);
      if(window.bfFila.pendentes()>0){ if(!auto) aviso('⏳ '+window.bfFila.pendentes()+' confirmação(ões) à espera de rede — vão ser enviadas sozinhas. Nada se perde.'); return false; }
    }
    emSync = true;
    if(!auto) aviso('⏳ A atualizar…');
    try{
      const [bl,pr,cl,mo,ma,gu,gb,li] = await Promise.all([ler('blocos','numero'),ler('processos','codigo'),ler('clientes','codigo'),ler('motoristas','nome'),ler('maquinistas','nome'),ler('guias','registado_em,id'),ler('guia_blocos','guia_id,bloco'),ler('liberacoes','quando,id')]);
      STATE.blocos = bl.map(blocoDoServidor);
      /* guias do servidor -> lista de confirmações, números usados e dados da viagem dos blocos em trânsito */
      const blocosDaGuia = new Map(); gb.forEach(r=>{ if(!blocosDaGuia.has(r.guia_id)) blocosDaGuia.set(r.guia_id, []); blocosDaGuia.get(r.guia_id).push(r.bloco); });
      const pesoDe = new Map(STATE.blocos.map(b=>[b.numero, b.pesoKg||0]));
      const POSTOS_REDE = ['Chibia','Arimba','Caraculo','Saco-Mar','Sogester'];
      const lista = gu.slice().sort((a,b)=> new Date(b.registado_em)-new Date(a.registado_em)).map(g=>{
        const t = new Date(g.ocorrido_em || g.registado_em);
        const comb = g.modal==='comboio', emb = g.tipo==='embarque';
        const blocos = blocosDaGuia.get(g.id) || [];
        const paraEmb = g.situacao==='embarcou' ? 'Embarcado · '+(g.navio||'?') : ({aguarda_navio:'Sogester (aguarda navio)', entregue_sogester:'Sogester (entregue)', aguarda_embarque_contentor:'Sogester (aguarda embarque contentor)'}[g.situacao] || 'Sogester');
        return { id:g.id, numero:g.numero!=null?+g.numero:null, tipo:g.tipo,
          data: t.toLocaleDateString('en-CA',{timeZone:'Africa/Luanda'}),
          hora: t.toLocaleTimeString('pt-PT',{timeZone:'Africa/Luanda',hour:'2-digit',minute:'2-digit',hour12:false}),
          de:g.de, para: emb ? paraEmb : g.para, modal: emb ? 'embarque' : (g.modal||'camiao'),
          carruagem: g.carruagem||null, motorista: emb ? null : (comb ? g.maquinista : g.motorista), viatura: emb ? null : (comb ? g.locomotiva : g.viatura),
          missaoId: emb ? (g.processo||null) : null, poroes: g.poroes||null, blocos,
          pesoKg: blocos.reduce((s,n)=>s+(pesoDe.get(n)||0),0), divergente:false, desvio:null, posto:g.posto||null, registadoPor:g.registado_por||null };
      });
      STATE.guias = lista;
      STATE.listasExportacao = li.slice().sort((a,b)=> new Date(b.quando)-new Date(a.quando)).map(x=>{ const t = new Date(x.quando); const n = (x.blocos||[]).length;
        return { ref:x.ref, modo:x.modo, quando: t.toLocaleDateString('en-CA',{timeZone:'Africa/Luanda'})+' '+t.toLocaleTimeString('pt-PT',{timeZone:'Africa/Luanda',hour:'2-digit',minute:'2-digit',hour12:false}), total:(x.pedidos!=null?x.pedidos:n), aplicados:n, jaEstava:(x.ja_estava||0), naoEncontrados:(x.nao_encontrados||[]) }; });
      const usadas = lista.filter(g=> g.numero!=null && (g.tipo==='saida' || (g.tipo==='entrada' && !POSTOS_REDE.includes(g.de)))).map(g=>g.numero);
      STATE.guiasUsadas = new Set(usadas);
      STATE.ultimaGuia = usadas.length ? Math.max.apply(null, usadas) : 0;
      const saidaPor = new Map(); lista.slice().reverse().forEach(g=>{ if(g.tipo==='saida' && g.numero!=null) saidaPor.set(g.numero+'|'+g.de, g); });
      STATE.blocos.forEach(b=>{ if(b.estado!=='a_caminho') return; const g = saidaPor.get(b.guiaMovimento+'|'+b.origemMovimento); if(!g) return;
        b.modalMovimento=g.modal; b.motoristaMovimento=g.motorista; b.viaturaMovimento=g.viatura; b.carruagemMovimento=g.carruagem; b.dataMovimento=g.data; b.horaMovimento=g.hora; });
      STATE.processos = pr.map(p=>({ codigo:p.codigo, cliente:p.cliente, origem:'Mingue', meta:p.meta, metaTon:p.meta_ton!=null?+p.meta_ton:null, porConfirmar:p.por_confirmar, criadoEm:p.criado_em, criadoPor:'Servidor',
        navio:p.navio, tipo:p.tipo, estado:p.estado }));
      STATE.clientes = cl.map(c=>({ codigo:c.codigo, nome:c.nome||c.codigo }));
      STATE.missoes = pr.filter(p=>p.navio).map(p=>({ id:p.codigo, navio:p.navio, tipo:p.tipo, local:p.local_carregamento, meta:p.meta, metaTon:+p.meta_ton||0,
        dataCarregamento:fmt(p.data_embarque), dataPosicionamento:fmt(p.data_posicionamento), estado:p.estado==='activo'?'activa':'encerrada' }));
      if(mo.length) STATE.motoristas = mo.map(m=>({ nome:m.nome, matricula:m.matricula, activo:m.activo }));
      if(ma.length) STATE.maquinistas = ma.map(m=>({ maquinista:m.nome||m.maquinista, locomotiva:m.locomotiva||m.loco||'', nome:m.nome||m.maquinista, activo:m.activo }));
      if(!(auto && aEscrever())) render();
      window.BF_ULTIMO_SYNC = Date.now(); if(window.bfFila) window.bfFila.desenhar();
      const d=new Date(); if(!auto) aviso(`🔄 Atualizado às ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} · ${STATE.blocos.length} blocos · ${STATE.processos.length} processos`);
      return true;
    }catch(e){ if(!auto){ const el=document.getElementById('save-bar-txt'); if(el){ el.textContent='Sem ligação neste momento — o que já tens no aparelho continua a funcionar.'; el.style.color='var(--ink-mute)'; } } return false; }
    finally{ emSync = false; }
  };
  /* atualização automática: de minuto a minuto, ao voltar à app e quando a rede regressa */
  const auto = ()=>{ if(document.visibilityState==='visible' && navigator.onLine!==false && window.BF_USER) window.bfSincronizar('auto'); };
  setInterval(auto, 60000);
  document.addEventListener('visibilitychange', auto);
  window.addEventListener('online', ()=>setTimeout(auto, 1500));
})();
</script>

<script>
/* ---- PASSO 3: FILA OFFLINE (envia sozinha quando há rede) + REGISTO DO SERVICE WORKER ---- */
(function(){
  const KF='bf_fila_v1', KC='bf_conflitos_v1';
  const ler = k=>{ try{ return JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){ return []; } };
  const gravar = (k,v)=>{ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ console.warn('Não foi possível guardar a fila', e); } };
  const uid = ()=> (window.BF_USER && window.BF_USER.user_id) || null;
  const meus = ()=> ler(KF).filter(x=>x.user===uid());
  let emVoo = false;
  const ehRede = e=>{
    const m = String((e && e.message) || e || '');
    if(navigator.onLine===false) return true;
    if(e && (e.code==='PGRST301' || /jwt/i.test(m))) return true;                 // sessão a renovar
    return /failed to fetch|networkerror|network request failed|load failed|fetch failed|timeout|timed out|gateway|bad gateway|unavailable/i.test(m) || (e && e.code===undefined && !e.status && /TypeError/i.test(m));
  };
  function adicionar(payload, resumo, rpc){
    const f = ler(KF); f.push({ user: uid(), quando: new Date().toISOString(), resumo, payload, rpc: rpc||'registar_guia', tentativas: 0 }); gravar(KF, f); desenhar();
  }
  const pendentes = ()=> meus().length;
  async function flush(sincronizarNoFim){
    if(emVoo || !window.sb || !uid() || navigator.onLine===false) return;
    if(!meus().length) return;
    emVoo = true; let enviados = 0, msgEnviada = false;
    try{
      for(;;){
        const it = meus()[0]; if(!it) break;
        let res;
        try{
          const {data,error} = await window.sb.rpc(it.rpc||'registar_guia', { p: it.payload });
          if(error) throw error; res = data || {};
          if(it.rpc==='enviar_mensagem') msgEnviada = true;
        }catch(e){
          if(ehRede(e)) break;                                                   // continua em fila
          const f = ler(KF); const i = f.findIndex(x=>x.payload.client_id===it.payload.client_id);
          if(i>=0){ f[i].tentativas=(f[i].tentativas||0)+1; f[i].ultimoErro=String((e&&e.message)||e); gravar(KF,f); }
          break;
        }
        gravar(KF, ler(KF).filter(x=>x.payload.client_id!==it.payload.client_id)); enviados++;
        if(res.erro || (res.recusados && res.recusados.length)){
          const c = ler(KC); c.push({ quando: it.quando, resumo: it.resumo, erro: res.erro||null, recusados: res.recusados||[] }); gravar(KC, c);
        }
      }
    } finally { emVoo = false; desenhar(); }
    if(msgEnviada && window.bfSala) window.bfSala.puxar();
    if(enviados>0 && !meus().length && sincronizarNoFim!==false && window.bfSincronizar) await window.bfSincronizar(false);
  }
  function abrirConflitos(){
    const c = ler(KC); if(!c.length) return;
    const ov = document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99999;display:flex;align-items:center;justify-content:center;padding:14px;';
    const linhas = c.map(x=>`<div style="border-top:1px solid #ddd;padding:8px 0;font-size:13px;"><strong>${x.resumo||'confirmação'}</strong><br><span style="color:#8A3B12;">${x.erro||''}${(x.recusados||[]).map(r=>`bloco ${r.bloco}: ${r.motivo}`).join(' · ')}</span><br><span style="color:#736E5E;font-size:11.5px;">${(x.quando||'').slice(0,16).replace('T',' ')}</span></div>`).join('');
    ov.innerHTML = `<div style="background:#FBFAF6;border-radius:12px;max-width:440px;width:100%;max-height:80vh;overflow:auto;padding:16px;">
      <p style="margin:0 0 6px;font-weight:700;font-size:15px;">Recusadas pelo servidor</p>
      <p style="margin:0 0 8px;font-size:12.5px;color:#403E36;">Estas confirmações foram feitas sem rede, mas na altura de enviar o servidor viu que já não batiam com a realidade. O que está registado no servidor é o que vale. Fala com a Logística para corrigir no terreno.</p>
      ${linhas}
      <div style="display:flex;gap:8px;margin-top:12px;"><button id="cf-ok" class="btn ghost" style="flex:1;">Fechar</button><button id="cf-limpar" class="btn primary" style="flex:1;">Já vi — limpar lista</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelector('#cf-ok').onclick = ()=>ov.remove();
    ov.querySelector('#cf-limpar').onclick = ()=>{ gravar(KC, []); ov.remove(); desenhar(); };
  }
  function desenhar(){
    const chip = document.getElementById('user-chip'); if(!chip) return;
    let b = document.getElementById('bf-fila');
    if(!b){ b = document.createElement('button'); b.id='bf-fila'; b.type='button'; b.className='btn ghost small'; b.style.marginLeft='6px';
      b.onclick = ()=>{ if(ler(KC).length) abrirConflitos(); else flush(true); }; chip.appendChild(b); }
    const n = pendentes(), nc = ler(KC).length, off = navigator.onLine===false, outros = ler(KF).length - n;
    const hs = window.BF_ULTIMO_SYNC ? new Date(window.BF_ULTIMO_SYNC).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',hour12:false}) : null;
    let t = off ? '○ Sem rede' : ('● Ligado' + (hs ? ' · atualizado '+hs : ''));
    if(n) t += ` · ⏳ ${n} por enviar`;
    if(nc) t += ` · ⚠ ${nc} recusada(s)`;
    if(outros>0) t += ` · ${outros} de outro utilizador`;
    b.textContent = t;
    b.style.color = nc ? 'var(--rust)' : (off||n ? '#8A5E0B' : 'inherit');
  }
  window.bfFila = { adicionar, pendentes, flush, ehRede, desenhar };
  window.addEventListener('online', ()=>{ desenhar(); flush(true); });
  window.addEventListener('offline', desenhar);
  setInterval(()=>{ desenhar(); if(navigator.onLine!==false && pendentes()>0) flush(true); }, 20000);
  setTimeout(()=>{ desenhar(); flush(true); }, 3000);
  if('serviceWorker' in navigator && location.protocol==='https:'){
    window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW', e)); });
  }
})();
</script>

<script>
/* ---- FEEDBACK POSITIVO (bolha que estoura) + SOM/VIBRAÇÃO ---- */
(function(){
  const ligado = ()=>{ try{ return localStorage.getItem('bf_som')!=='0'; }catch(e){ return true; } };
  const AC = window.AudioContext || window.webkitAudioContext; let ctx = null;
  const desbloquear = ()=>{ if(!AC) return; try{ if(!ctx) ctx = new AC(); if(ctx.state==='suspended') ctx.resume(); }catch(e){} };
  ['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev, desbloquear, {passive:true}));
  function tom(f0,f1,dur,vol,atraso,tipo){
    if(!ctx || !ligado()) return;
    const t = ctx.currentTime + (atraso||0), o = ctx.createOscillator(), g = ctx.createGain();
    o.type = tipo||'sine'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+0.03);
  }
  const vib = p=>{ if(ligado() && navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } };
  const API = {
    ligado, alternar(){ try{ localStorage.setItem('bf_som', ligado()?'0':'1'); }catch(e){} },
    pop(){ tom(1000,150,0.12,0.30,0.5,'sine'); tom(523,523,0.18,0.12,0.68,'triangle'); tom(784,784,0.32,0.14,0.82,'triangle'); setTimeout(()=>vib([50,40,90]),500); },
    pendente(){ tom(520,400,0.2,0.18,0.1,'sine'); vib([70]); },
    alerta(){ tom(880,880,0.14,0.22,0,'triangle'); tom(1175,1175,0.2,0.22,0.18,'triangle'); vib([120,70,120]); }
  };
  window.bfFeedback = API;
  const css = document.createElement('style');
  css.textContent = `
  #bf-celebra{position:fixed;inset:0;z-index:100000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,30,25,.42);animation:bfc-in .18s ease-out both;cursor:pointer;}
  #bf-celebra.sai{animation:bfc-out .3s ease-in both;}
  .bfc-card{position:relative;width:170px;height:170px;display:flex;align-items:center;justify-content:center;}
  .bfc-bolha{position:absolute;width:128px;height:128px;border-radius:50%;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.85) 0,rgba(255,255,255,0) 26%),radial-gradient(circle at 50% 50%,rgba(255,255,255,.10) 55%,var(--c) 100%);border:3px solid var(--c);animation:bfc-bolha .55s ease-in both;}
  .bfc-ok{position:absolute;width:118px;height:118px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.30),inset -6px -8px 14px rgba(0,0,0,.16);transform:scale(0);animation:bfc-ok .5s cubic-bezier(.2,.9,.3,1.35) .5s both;}
  .bfc-ok svg{width:64px;height:64px;}
  .bfc-ok path{stroke:#fff;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:bfc-traco .4s ease-out .8s forwards;}
  .bfc-anel{position:absolute;width:128px;height:128px;border-radius:50%;border:4px solid var(--c);opacity:0;animation:bfc-anel .7s ease-out .5s both;}
  .bfc-anel.b{animation-delay:.62s;}
  .bfc-p{position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--c);opacity:0;animation:bfc-p .7s ease-out .5s both;}
  .bfc-t{margin:18px 0 2px;color:#fff;font-size:21px;font-weight:700;text-align:center;opacity:0;animation:bfc-txt .35s ease-out .75s both;padding:0 16px;}
  .bfc-s{margin:0;color:rgba(255,255,255,.9);font-size:14.5px;text-align:center;opacity:0;animation:bfc-txt .35s ease-out .9s both;padding:0 16px;}
  @keyframes bfc-in{from{opacity:0}to{opacity:1}} @keyframes bfc-out{from{opacity:1}to{opacity:0}}
  @keyframes bfc-bolha{0%{transform:scale(.15);opacity:.2}55%{transform:scale(1.05,.96);opacity:1}80%{transform:scale(.97,1.05)}100%{transform:scale(1.42);opacity:0}}
  @keyframes bfc-ok{0%{transform:scale(0)}100%{transform:scale(1)}}
  @keyframes bfc-traco{to{stroke-dashoffset:0}}
  @keyframes bfc-anel{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.9);opacity:0}}
  @keyframes bfc-p{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
  @keyframes bfc-txt{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.bfc-bolha,.bfc-anel,.bfc-p{display:none}.bfc-ok{animation:none;transform:none}.bfc-ok path{animation:none;stroke-dashoffset:0}.bfc-t,.bfc-s{animation:none;opacity:1}}`;
  document.head.appendChild(css);
  window.celebrar = function(titulo, sub, tipo){
    const pend = tipo==='pendente';
    const velho = document.getElementById('bf-celebra'); if(velho) velho.remove();
    const ov = document.createElement('div'); ov.id = 'bf-celebra'; ov.setAttribute('role','status');
    ov.style.setProperty('--c', pend ? '#B07A12' : '#2E7D4F');
    const card = document.createElement('div'); card.className = 'bfc-card';
    card.innerHTML = '<div class="bfc-bolha"></div><div class="bfc-anel"></div><div class="bfc-anel b"></div><div class="bfc-ok"><svg viewBox="0 0 64 64"><path d="M14 34 L27 47 L50 20"/></svg></div>';
    for(let k=0;k<10;k++){ const a = (Math.PI*2*k)/10, d = 78 + (k%2)*14; const pt = document.createElement('i'); pt.className='bfc-p';
      pt.style.setProperty('--x', Math.round(Math.cos(a)*d)+'px'); pt.style.setProperty('--y', Math.round(Math.sin(a)*d)+'px'); card.appendChild(pt); }
    const t = document.createElement('p'); t.className='bfc-t'; t.textContent = titulo;
    const sb = document.createElement('p'); sb.className='bfc-s'; sb.textContent = sub||'';
    ov.appendChild(card); ov.appendChild(t); ov.appendChild(sb); document.body.appendChild(ov);
    if(pend) API.pendente(); else API.pop();
    const fechar = ()=>{ if(!ov.parentNode) return; ov.classList.add('sai'); setTimeout(()=>ov.remove(),320); };
    const criado = Date.now();
    ov.onclick = ()=>{ if(Date.now()-criado>700) fechar(); };
    setTimeout(fechar, pend ? 2600 : 2300);
  };
  /* botão 🔔/🔕 na gaveta da Sala */
  const fechar = document.getElementById('sala-close');
  if(fechar){ const b = document.createElement('button'); b.id='sala-som'; b.type='button'; b.style.cssText='border:none;background:none;font-size:18px;cursor:pointer;margin-left:auto;margin-right:8px;';
    const pinta = ()=>{ b.textContent = ligado() ? '🔔' : '🔕'; b.title = ligado() ? 'Som e vibração ligados' : 'Som e vibração desligados'; };
    pinta(); b.onclick = ()=>{ API.alternar(); pinta(); if(ligado()) API.alerta(); }; fechar.parentNode.insertBefore(b, fechar); }
})();
</script>

<script>
/* ---- SALA NO SERVIDOR: mensagens partilhadas, aviso sonoro, não lidas, funciona sem rede ---- */
(function(){
  const KS = 'bf_sala';
  const J = (k,d)=>{ try{ return JSON.parse(localStorage.getItem(k)||d); }catch(e){ return JSON.parse(d); } };
  const eu = ()=> window.BF_USER && window.BF_USER.user_id;
  const KL = ()=> 'bf_sala_lido_'+eu();
  const fmt = iso=>{ const t = new Date(iso); return t.toLocaleDateString('en-CA',{timeZone:'Africa/Luanda'})+' '+t.toLocaleTimeString('pt-PT',{timeZone:'Africa/Luanda',hour:'2-digit',minute:'2-digit',hour12:false}); };
  const mapear = r=>({ id:r.id, client_id:r.client_id, processo:r.processo, autor:r.funcao||'—', nome:r.autor_nome||null, autorId:r.autor, texto:r.texto, quando:fmt(r.criado_em), sistema:!!r.sistema });
  const guardar = ()=>{ try{ localStorage.setItem(KS, JSON.stringify(STATE.sala||[])); }catch(e){} };
  const gerarId = ()=> (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{ const r=Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); });
  const ROTULO = { conferente:null, logistica:'Logística', transportes:'Transporte', direcao:'Direção', producao:'Produção', admin:'Admin' };
  let primeira = true, maxId = 0, emPuxar = false, canal = null;
  const aberta = ()=>{ const o = document.getElementById('sala-overlay'); return !!o && o.style.display==='block'; };
  function naoLidas(){ const L = J(KL(),'{}'); return (STATE.sala||[]).filter(m=>m.id && m.autorId!==eu() && m.id>(L[m.processo]||0)).length; }
  function marcarLida(proc){
    if(!eu() || !aberta()) return;
    const L = J(KL(),'{}'); const mx = Math.max(0, ...(STATE.sala||[]).filter(m=>m.id && m.processo===proc).map(m=>m.id));
    if(mx>(L[proc]||0)){ L[proc]=mx; try{ localStorage.setItem(KL(), JSON.stringify(L)); }catch(e){} }
    setTimeout(()=>{ if(typeof renderSalaFab==='function') renderSalaFab(); },0);
  }
  function atualizarUI(){
    if(typeof renderSalaFab==='function') renderSalaFab();
    if(aberta() && typeof renderSalaDrawer==='function') renderSalaDrawer();
  }
  async function puxar(){
    if(emPuxar || !window.sb || !eu() || navigator.onLine===false) return;
    emPuxar = true; const novas = [];
    try{
      if(primeira){ STATE.sala = (STATE.sala||[]).filter(m=>!m.id && m.client_id); maxId = 0; }   // a cópia local nunca manda: relê tudo do servidor (resiste a uma limpeza da base de dados)
      for(;;){
        const {data,error} = await window.sb.from('mensagens').select('*').gt('id',maxId).order('id',{ascending:true}).limit(500);
        if(error) throw error; if(!data || !data.length) break;
        data.forEach(r=>{ maxId = Math.max(maxId, r.id); novas.push(mapear(r)); });
        if(data.length<500) break;
      }
    }catch(e){ emPuxar = false; const msg = String((e && e.message) || e); if(window.BF_SALA_ERRO!==msg){ window.BF_SALA_ERRO = msg; atualizarUI(); } return; }
    emPuxar = false;
    if(window.BF_SALA_ERRO){ window.BF_SALA_ERRO = null; atualizarUI(); }
    if(primeira && localStorage.getItem(KL())===null){      // primeira vez neste aparelho: o histórico conta como lido
      const L = {}; (STATE.sala||[]).concat(novas).forEach(m=>{ if(m.id) L[m.processo] = Math.max(L[m.processo]||0, m.id); });
      try{ localStorage.setItem(KL(), JSON.stringify(L)); }catch(e){}
    }
    if(novas.length){
      const cids = new Set(novas.map(n=>n.client_id).filter(Boolean));
      STATE.sala = (STATE.sala||[]).filter(m=>!(!m.id && m.client_id && cids.has(m.client_id))).concat(novas);
      STATE.sala.sort((a,b)=>(a.id||1e15)-(b.id||1e15));
      guardar();
      const deOutros = novas.filter(n=>n.autorId!==eu() && !n.sistema);
      if(!primeira && deOutros.length && window.bfFeedback) window.bfFeedback.alerta();
    }
    primeira = false;
    if(novas.length) atualizarUI();
  }
  let ultimoEnvio = { k:'', t:0 };
  async function enviar(proc, texto){
    const k = proc+'|'+texto; if(ultimoEnvio.k===k && Date.now()-ultimoEnvio.t<3000) return;   // duplo toque
    ultimoEnvio = { k, t: Date.now() };
    const u = window.BF_USER; const cid = gerarId();
    const funcao = (u.papel==='conferente' && typeof postoAtivo!=='undefined') ? postoAtivo : null;
    const item = { id:null, client_id:cid, processo:proc, autor: funcao || ROTULO[u.papel] || '—', nome:u.nome, autorId:u.user_id, texto, quando:fmt(new Date().toISOString()), sistema:false, pendente:true };
    STATE.sala = STATE.sala || []; STATE.sala.push(item); guardar();
    if(typeof renderSalaFab==='function') renderSalaFab(); if(aberta() && typeof renderSalaDrawer==='function') renderSalaDrawer(true);
    const payload = { client_id:cid, processo:proc, texto, funcao };
    const retirar = ()=>{ STATE.sala = STATE.sala.filter(m=>m!==item); guardar(); atualizarUI(); };
    try{
      const {data,error} = await window.sb.rpc('enviar_mensagem', { p: payload });
      if(error) throw error;
      if(data && data.erro){ retirar(); alert('A mensagem não foi enviada: '+data.erro); return; }
      item.pendente = false; guardar(); atualizarUI();   // o servidor aceitou
      puxar();
    }catch(e){
      if(window.bfFila && window.bfFila.ehRede(e)) window.bfFila.adicionar(payload, 'mensagem · '+proc, 'enviar_mensagem');
      else { retirar(); alert('A mensagem não foi enviada: '+(e.message||e)); }
    }
  }
  function ligarTempoReal(){
    if(canal || !window.sb || !eu()) return;
    try{ canal = window.sb.channel('sala-mensagens').on('postgres_changes',{ event:'INSERT', schema:'public', table:'mensagens' }, ()=>puxar()).subscribe(); }catch(e){ canal = null; }
  }
  window.bfSala = { enviar, puxar, naoLidas, marcarLida };
  const arranque = setInterval(()=>{ if(eu()){ clearInterval(arranque); ligarTempoReal(); puxar(); } }, 800);
  setInterval(()=>{ if(eu()){ ligarTempoReal(); if(document.visibilityState==='visible') puxar(); } }, 15000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') puxar(); });
  window.addEventListener('online', ()=>setTimeout(puxar,1200));
})();
</script>
